/* ===== css/variables.css ===== */
/* =====================================================================
   VARIABLES — palette, echelle, ombres, rythme

   Principes de la palette :
   - L'encre est le brun de la marque (#241D15). Il porte le texte, les
     pills actives, les fonds pleins. C'est lui qui donne le caractere.
   - L'or est un ACCENT, pas une couleur de fond. Il est reserve a l'action
     principale, a l'onglet actif et aux valeurs de stock. Employe partout,
     il ne ressort nulle part.
   - Les teintes claires (--*-bg) sont des couleurs pleines, pas des alpha :
     elles restent nettes quel que soit le fond qui passe dessous.

   Profondeur : les surfaces ne sont pas des aplats mais de tres legers
   degrades verticaux (--gS*), doubles d'un filet de lumiere interieur
   (--shIn). C'est ce qui donne aux cartes leur relief de papier sans
   recourir a des ombres lourdes.

   Les trois blocs decrivent le meme jeu de variables :
     1. :root                       -> theme clair (valeurs de reference)
     2. @media prefers-color-scheme -> theme sombre suivant le systeme
     3. :root[data-theme="dark"]     -> theme sombre force par l'utilisateur
   Une couleur ne doit jamais etre definie uniquement dans 2 ou 3.
   ===================================================================== */
:root{
  color-scheme:light dark;

  /* --- Accent de marque --- */
  --gold:#B57F14;--gold-h:#996A0B;--gold-l:#E3B95F;--gold-d:#7C5507;
  --gold-bg:#FBF2DF;--gold-bd:#EDD9AF;
  --gold-gr:linear-gradient(180deg,#C68F22 0%,#AC760D 100%);
  --gold-gr-h:linear-gradient(180deg,#D19A2C 0%,#9A6A08 100%);
  --gold-glow:rgba(181,127,20,.32);

  /* --- Couleurs de sens --- */
  --green:#2E7D4F;--green-bg:#E8F3EB;--green-bd:#CBE3D4;--green-l:#4FA173;
  --red:#C0392B;--red-bg:#FAEAE8;--red-bd:#F0D1CD;--red-l:#DB6B5C;
  --blue:#2B6CB0;--blue-bg:#E8F0F8;--blue-bd:#D1DFEF;--blue-l:#5B93D0;

  /* --- Surfaces --- */
  --bg:#F6F3EE;          /* canevas de la page */
  --bg2:#FFFFFF;         /* cartes et panneaux */
  --bg3:#FBF9F5;         /* tuiles a l'interieur d'une carte */
  --bgS:#FFFFFF;         /* sidebar */
  --bgI:#F3F0EA;         /* champs de saisie */
  --bgH:#F9F6F1;         /* survol */
  --bgZ:#FCFAF7;         /* lignes paires des tableaux */
  --bgM:rgba(32,25,17,.42);

  /* Degrades de surface : 1 a 2 % d'ecart, jamais plus. Au-dela, le
     degrade se voit et la carte prend un air de bouton. */
  --gS2:linear-gradient(180deg,#FFFFFF 0%,#FDFBF8 100%);
  --gS3:linear-gradient(180deg,#FCFAF7 0%,#F8F5F0 100%);
  --gSS:linear-gradient(180deg,#FFFFFF 0%,#FCFAF6 100%);   /* sidebar */

  /* --- Encre --- */
  --tx:#221B13;          /* texte principal = brun de la marque */
  --tx2:#6B6052;         /* texte secondaire */
  --tx3:#9A8F7E;         /* legendes, unites */
  --txS:#6B6052;         /* sidebar au repos */
  --txSA:#221B13;        /* sidebar actif */
  --txInv:#FFFDF9;       /* texte sur aplat d'encre ou d'or */

  /* --- Traits et profondeur --- */
  --bd:#EAE3D8;          /* filet standard */
  --bd2:#D9D0C1;         /* filet appuye */
  --bdA:rgba(181,127,20,.34);  /* filet accentue au survol */

  --sh:0 1px 2px rgba(46,35,22,.05),0 1px 1px rgba(46,35,22,.03);
  --shH:0 12px 28px -14px rgba(46,35,22,.22),0 2px 6px -2px rgba(46,35,22,.07);
  --shL:0 32px 64px -22px rgba(46,35,22,.3),0 4px 14px -6px rgba(46,35,22,.1);
  --shF:0 0 0 3px rgba(181,127,20,.17);   /* halo de focus */
  --shIn:inset 0 1px 0 rgba(255,255,255,.9);  /* filet de lumiere haut */
  --shBtn:0 1px 2px rgba(46,35,22,.14),inset 0 1px 0 rgba(255,255,255,.22);

  /* --- Geometrie --- */
  --r:15px;--rS:10px;--rXS:7px;--rL:20px;--rF:999px;--sw:256px;

  /* --- Rythme vertical et horizontal --- */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:44px;

  /* --- Mouvement --- */
  --tr:.16s cubic-bezier(.4,0,.2,1);
  --trS:.3s cubic-bezier(.4,0,.2,1);
  --trB:.42s cubic-bezier(.22,1,.36,1);   /* sortie longue, pour les entrees */
}

  --sh:0 1px 2px rgba(0,0,0,.34),0 1px 1px rgba(0,0,0,.2);

:root[data-theme="dark"]{
  --gold:#E2AF52;--gold-h:#F1C77E;--gold-l:#F1D298;--gold-d:#B98A2E;

  --gold-gr:linear-gradient(180deg,#D9A748 0%,#B7862B 100%);
  --gold-gr-h:linear-gradient(180deg,#E7B655 0%,#C29033 100%);
  --gold-glow:rgba(226,175,82,.3);

  --green:#5BB47F;--green-bg:#16271C;--green-bd:#26402F;--green-l:#7ACB9B;
  --red:#E4796B;--red-bg:#2B1613;--red-bd:#43231E;--red-l:#EE9587;
  --blue:#6DA8E2;--blue-bg:#13202C;--blue-bd:#213244;--blue-l:#8CBDEC;

  --gS2:linear-gradient(180deg,#1D1815 0%,#181411 100%);
  --gS3:linear-gradient(180deg,#231E19 0%,#1E1915 100%);
  --gSS:linear-gradient(180deg,#171312 0%,#131010 100%);

  --tx:#F0E9DF;--tx2:#A79B8E;--tx3:#82776A;
  --txS:#A79B8E;--txSA:#F6F0E7;--txInv:#17120D;

  --bd:#2E2822;--bd2:#3D352C;--bdA:rgba(226,175,82,.34);

  --sh:0 1px 2px rgba(0,0,0,.34),0 1px 1px rgba(0,0,0,.2);
  --shH:0 12px 28px -14px rgba(0,0,0,.66),0 2px 6px -2px rgba(0,0,0,.4);
  --shL:0 32px 64px -22px rgba(0,0,0,.76),0 4px 14px -6px rgba(0,0,0,.5);
  --shF:0 0 0 3px rgba(226,175,82,.22);
  --shIn:inset 0 1px 0 rgba(255,255,255,.045);
  --shBtn:0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);

/* ===== css/base.css ===== */
/* =====================================================================
   BASE — reset, echelle typographique, elements natifs

   L'echelle typographique porte la hierarchie : un titre de page se lit
   comme un titre, une valeur cle comme une valeur cle, une legende comme
   une legende. C'est le contraste de taille et de graisse qui structure
   l'ecran, pas les bordures ni les couleurs.
   ===================================================================== */
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:.95rem;
  background:var(--bg);color:var(--tx);line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}

/* Ambiance du canevas : deux halos d'or tres dilues, fixes, en haut a
   gauche et en bas a droite. Ils ne se lisent pas comme une couleur —
   ils empechent seulement le fond de paraitre plat sur un grand ecran.
   ::before plutot qu'un background sur body : le degrade ne se repete
   pas et ne se deforme pas au defilement. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 12% -8%,var(--gold-bg),transparent 62%),
    radial-gradient(900px 560px at 105% 108%,var(--gold-bg),transparent 60%);
  opacity:.55;
}

/* Titres : Outfit, resserre. Le crenage negatif evite l'effet « etale »
   des grandes tailles geometriques. */
h1,h2,h3,h4{font-family:'Outfit',sans-serif;font-weight:600;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:-.032em;line-height:1.16}
h2{font-size:1.35rem;letter-spacing:-.02em}
h3{font-size:1.02rem;letter-spacing:-.012em}
h4{font-size:.95rem}

a{color:var(--gold);text-decoration:none;transition:color var(--tr)}
a:hover{color:var(--gold-h);text-decoration:underline;text-underline-offset:2px}

input,select,textarea,button{font-family:inherit;font-size:inherit}
strong{font-weight:600}

/* Chiffres alignes en colonne : les montants restent comparables d'une
   ligne a l'autre. */
.num,.st-v,.tv,.hero-v,.mini-v,.big-n,table{font-variant-numeric:tabular-nums}

/* Sur-titre : petites capitales espacees, pour nommer un bloc sans
   concurrencer les valeurs qu'il contient. */
.eyebrow{
  font-family:'Outfit',sans-serif;font-size:.71rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);
}

/* Garde-fou : une icone posee par icon() dans un contexte non prevu prend
   la taille du texte au lieu de s'etaler sur toute la largeur disponible.
   Chaque composant qui a besoin d'une autre taille la redefinit. */
svg{width:1.2em;height:1.2em;flex-shrink:0}

/* Barres de defilement discretes */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:var(--rF);border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box;border:3px solid transparent}

/* Focus visible au clavier, jamais a la souris */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:var(--rXS)}
::selection{background:var(--gold-bg);color:var(--tx)}

/* ===== css/animations.css ===== */
/* =====================================================================
   ANIMATIONS — keyframes partagees et respect des preferences systeme

   Une seule courbe pour les entrees : cubic-bezier(.22,1,.36,1). Elle
   part vite et s'arrete en douceur, ce qui donne un mouvement pose sans
   ralentir l'interface. Les durees restent sous 350 ms — au-dela, on
   attend l'animation au lieu de lire l'ecran.
   ===================================================================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
@keyframes growBar{from{height:0}}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{to{transform:scale(2.4);opacity:0}}

/* Apparition de la page active. La classe est retiree puis remise a chaque
   navigation (voir nav.js) pour relancer l'animation. */
.page-in{animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}

/* Entree des panneaux de tete */
.hero>*{animation:fadeUp .34s cubic-bezier(.22,1,.36,1) both}
.hero>*:nth-child(2){animation-delay:.07s}

/* Entree en cascade des cartes statistiques. Le pas est court (30 ms) :
   la rangee doit se poser comme un seul geste, pas defiler une carte
   apres l'autre. */
.stats>.st{animation:fadeUp .32s cubic-bezier(.22,1,.36,1) both}
.stats>.st:nth-child(1){animation-delay:.02s}
.stats>.st:nth-child(2){animation-delay:.05s}
.stats>.st:nth-child(3){animation-delay:.08s}
.stats>.st:nth-child(4){animation-delay:.11s}
.stats>.st:nth-child(5){animation-delay:.14s}
.stats>.st:nth-child(6){animation-delay:.17s}
.stats>.st:nth-child(7){animation-delay:.2s}

/* Meme principe pour les quatre tuiles de la journee en cours */
.today-grid>.today-item{animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
.today-grid>.today-item:nth-child(2){animation-delay:.04s}
.today-grid>.today-item:nth-child(3){animation-delay:.08s}
.today-grid>.today-item:nth-child(4){animation-delay:.12s}

/* Un utilisateur qui a demande moins d'animations n'en recoit aucune */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
}

/* ===== css/layout.css ===== */
/* =====================================================================
   LAYOUT — coquille : sidebar, zone principale, entete de page

   La sidebar est claire et separee par un simple filet. Le bandeau brun
   plein de la version precedente pesait un quart de l'ecran en permanence
   et ecrasait le contenu ; l'identite de marque passe desormais par
   l'encre du texte, par le logo et par l'or de l'onglet actif, pas par
   un aplat.

   Les regles responsive sont regroupees dans responsive.css, charge en
   dernier pour pouvoir surcharger tous les autres fichiers.
   ===================================================================== */
.app{display:flex;min-height:100vh;min-height:100dvh;width:100%}

/* --- Sidebar --- */
.side{
  width:var(--sw);background:var(--gSS);
  border-right:1px solid var(--bd);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:100;
  transition:transform var(--trS);
}

/* --- Marque --- */
/* Le logo est pose sur une pastille d'or : c'est le seul aplat de couleur
   permanent de l'interface, et il suffit a ancrer la marque. */
.side-brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 18px 16px;margin-bottom:2px;
}
.side-brand svg{
  width:38px;height:38px;border-radius:12px;
  box-shadow:0 5px 14px -5px var(--gold-glow);
}
.side-brand .bt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.side-brand .bn{
  font-family:'Outfit',sans-serif;font-weight:700;font-size:1.08rem;
  color:var(--tx);letter-spacing:-.024em;
}
.side-brand .bs{font-size:.72rem;color:var(--tx3);letter-spacing:.012em}

.nav-list{list-style:none;padding:4px 12px 14px;flex:1;overflow-y:auto}

/* Intertitre de groupe : structure la navigation sans ajouter de trait */
.nav-sec{
  font-family:'Outfit',sans-serif;font-size:.67rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);
  padding:18px 12px 7px;
}
.nav-list>.nav-sec:first-child{padding-top:6px}

/* Onglet : le repere actif est une reglette d'or a gauche, doublee d'un
   fond ambre tres pale. La reglette se deploie en hauteur — un onglet qui
   s'active ne clignote pas, il se remplit. */
.nav-item{
  position:relative;
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:var(--rS);
  color:var(--txS);cursor:pointer;
  font-size:.91rem;font-weight:500;margin-bottom:2px;
  transition:background var(--tr),color var(--tr);
}
.nav-item::before{
  content:"";position:absolute;left:-8px;top:50%;
  width:3px;height:0;border-radius:0 var(--rF) var(--rF) 0;
  background:var(--gold);transform:translateY(-50%);
  transition:height var(--trB);
}
.nav-item svg{width:18px;height:18px;color:var(--tx3);transition:color var(--tr)}
.nav-item:hover{background:var(--bgH);color:var(--txSA)}
.nav-item:hover svg{color:var(--tx2)}
.nav-item.active{
  background:var(--gold-bg);color:var(--gold-h);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--gold-bd);
}
.nav-item.active::before{height:20px}
.nav-item.active svg{color:var(--gold)}

/* --- Pied de sidebar : synchro, theme, deconnexion --- */
.side-foot{border-top:1px solid var(--bd);padding:10px 12px 12px;background:var(--bgS)}
.side-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}

.sync{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:var(--rS);
  font-size:.78rem;color:var(--tx3);min-width:0;
}
.sync svg{width:15px;height:15px}
.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.ok{color:var(--green)}
.sync.err{color:var(--red)}
.sync.busy{color:var(--gold)}
.sync.busy svg{animation:spin 1.1s linear infinite}

.theme-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border:1px solid var(--bd);border-radius:var(--rS);
  background:var(--gS2);color:var(--tx2);cursor:pointer;box-shadow:var(--sh);
  transition:background var(--tr),color var(--tr),border-color var(--tr),transform var(--tr);
}
.theme-btn:hover{background:var(--bgH);color:var(--gold);border-color:var(--gold-bd)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:15px;height:15px}

.nav-out{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border:none;border-radius:var(--rS);background:none;
  color:var(--txS);cursor:pointer;font-size:.9rem;font-family:inherit;
  transition:background var(--tr),color var(--tr);
}
.nav-out svg{width:17px;height:17px;color:var(--tx3);transition:color var(--tr)}
.nav-out:hover{background:var(--red-bg);color:var(--red)}
.nav-out:hover svg{color:var(--red)}

/* --- Zone principale --- */
/* Pas de largeur maximale : la zone occupe toute la largeur restante. La
   marge interieure suit la taille de l'ecran (clamp) pour ne pas coller
   aux bords sur grand ecran ni gaspiller la place sur petit. */
.main{flex:1;min-width:0;width:100%;margin-left:var(--sw);padding:34px clamp(24px,2.6vw,56px) 72px}
.page{width:100%;max-width:none}

.hamburger{
  display:none;position:fixed;top:12px;left:12px;z-index:200;
  background:var(--gS2);border:1px solid var(--bd);border-radius:var(--rS);
  width:42px;height:42px;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shH);font-size:1.2rem;color:var(--tx);
  transition:background var(--tr),transform var(--tr);
}
.hamburger:hover{background:var(--bgH)}
.hamburger:active{transform:scale(.94)}
.side-overlay{
  display:none;position:fixed;inset:0;z-index:90;
  background:var(--bgM);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fadeIn var(--tr);
}

/* --- Entete de page --- */
/* Le titre est suivi d'un filet qui court jusqu'au bord : il pose la
   ligne de depart du contenu sans encadrer quoi que ce soit. */
.pg-hd{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin-bottom:26px;padding-bottom:18px;flex-wrap:wrap;
  border-bottom:1px solid var(--bd);
}
.pg-hd .pg-sub{
  color:var(--tx2);font-size:.8rem;text-transform:capitalize;
  font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:.01em;
  padding:5px 12px;border-radius:var(--rF);
  background:var(--gS3);border:1px solid var(--bd);
}

/* ===== css/components.css ===== */
/* =====================================================================
   COMPOSANTS — boutons, cartes, panneaux, statistiques, badges, modale,
   toasts, pills, barres de progression, squelettes

   Regle de hierarchie des boutons : un seul bouton or par bloc, celui qui
   porte l'action principale. Tous les autres sont neutres. C'est ce qui
   rend l'action principale reperable au premier coup d'oeil.

   Regle de profondeur : au repos, une surface se distingue par son filet
   et un degrade d'un pour cent. L'ombre portee ne sert qu'a signaler ce
   qui flotte reellement au-dessus du reste — survol, modale, toast.
   ===================================================================== */

/* --- BOUTONS --- */
.btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 17px;border-radius:var(--rS);border:1px solid transparent;
  cursor:pointer;white-space:nowrap;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:.88rem;
  letter-spacing:.005em;
  transition:background var(--tr),color var(--tr),border-color var(--tr),box-shadow var(--tr),transform var(--tr);
}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}

/* Action principale : degrade d'or et halo colore au survol. Le halo
   reprend la couleur du bouton — une ombre grise sous un bouton dore le
   ferait paraitre sale. */
.btn-p{
  background:var(--gold-gr);color:var(--txInv);
  border-color:var(--gold-d);box-shadow:var(--shBtn);
}
.btn-p:hover{
  background:var(--gold-gr-h);
  box-shadow:0 6px 18px -6px var(--gold-glow),var(--shBtn);
  transform:translateY(-1px);
}
.btn-p:active{transform:translateY(0)}

.btn-s{background:var(--gS2);color:var(--tx);border-color:var(--bd2);box-shadow:var(--sh)}
.btn-s:hover{background:var(--bg2);border-color:var(--tx3);box-shadow:var(--shH);transform:translateY(-1px)}
.btn-s:active{transform:translateY(0)}

.btn-d{background:var(--red);color:#fff;box-shadow:var(--shBtn)}
.btn-d:hover{filter:brightness(1.08);box-shadow:0 6px 18px -6px rgba(192,57,43,.45)}

.btn-g{background:transparent;color:var(--tx2);padding:8px}
.btn-g:hover{color:var(--tx);background:var(--bgH)}

.btn-sm{padding:6px 12px;font-size:.82rem}

/* Pastille carree : les trois actions d'une ligne forment un groupe
   regulier, quelle que soit la largeur du glyphe qu'elles portent. */
.btn-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;
  background:none;border:none;color:var(--tx3);cursor:pointer;
  border-radius:var(--rXS);font-size:1.05rem;line-height:1;
  transition:color var(--tr),background var(--tr),transform var(--tr);
}
.btn-icon:hover{color:var(--red);background:var(--red-bg)}
.btn-icon:active{transform:scale(.92)}
.btn-icon.ok:hover{color:var(--green);background:var(--green-bg)}
.btn-icon.edit:hover{color:var(--gold);background:var(--gold-bg)}

/* Onde au clic, injectee par ui/ripple.js */
.rip{
  position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.4);transform:scale(0);
  animation:ripple .5s ease-out forwards;
}
.btn-s .rip,.btn-g .rip,.pill .rip{background:rgba(110,99,85,.16)}

/* --- CARTES ET PANNEAUX --- */
/* .card : conteneur courant. .panel : bloc de tete, plus genereux. */
.card,.panel{
  position:relative;
  background:var(--gS2);border:1px solid var(--bd);
  box-shadow:var(--sh),var(--shIn);
  transition:box-shadow var(--tr),border-color var(--tr),transform var(--tr);
}
.card{border-radius:var(--r);padding:22px 24px;margin-bottom:16px}
.panel{border-radius:var(--rL);padding:26px 28px;display:flex;flex-direction:column}
.card:hover,.panel:hover{
  border-color:var(--bd2);
  box-shadow:var(--shH),var(--shIn);
  transform:translateY(-1px);
}

/* Titre de bloc : l'icone est posee sur une pastille discrete, ce qui la
   rattache au titre au lieu de la laisser flotter dans la marge. */
.card h3,.panel h3{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--tx)}
.card h3 svg,.panel h3 svg{
  width:16px;height:16px;color:var(--gold);
  padding:6px;box-sizing:content-box;border-radius:9px;
  background:var(--gold-bg);box-shadow:inset 0 0 0 1px var(--gold-bd);
}
.card-sub{color:var(--tx2);font-size:.89rem;margin:-10px 0 16px;max-width:62ch}
/* Une carte qui contient un tableau ne se souleve pas au survol : le
   pointeur y circule en permanence, le bloc entier tressauterait. */
.card-flat{padding:0;overflow:hidden}
.card-flat:hover{transform:none}

/* --- BLOC DE TETE DU TABLEAU DE BORD --- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}

/* Le premier panneau porte le chiffre du mois : un halo d'or dilue en
   haut a droite le distingue du second sans changer sa couleur de fond. */
.hero>.panel:first-child::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(520px 260px at 100% 0%,var(--gold-bg),transparent 68%);
  opacity:.85;
}
.hero>.panel>*{position:relative}

.hero-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
/* Les deux panneaux de tete font la meme hauteur, mais pas le meme
   contenu. Les marges auto de part et d'autre du chiffre repartissent
   l'espace libre au lieu de le laisser s'accumuler en un trou. */
.hero-v{margin-top:auto;
  font-family:'Outfit',sans-serif;font-weight:700;
  font-size:clamp(2.3rem,2.6vw,3rem);line-height:1.02;
  letter-spacing:-.042em;color:var(--tx);
}
.hero-u{margin-top:8px;margin-bottom:auto;color:var(--tx2);font-size:.9rem}

/* Quatre valeurs secondaires sous la valeur principale.
   La largeur du panneau, pas celle de l'ecran, decide de la grille : a
   cote du bloc Stock, sur un portable de 1366 px, le panneau ne fait que
   ~550 px et quatre montants en ligne seraient tronques. On range alors
   en 2 x 2, et on passe sur une ligne des que la place le permet. */
.hero>.panel{container-type:inline-size}
.hero-split{
  display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
  margin-top:auto;padding-top:20px;border-top:1px solid var(--bd);
}
@container (min-width:580px){
  .hero-split{grid-template-columns:repeat(4,1fr)}
}
.mini-v{
  font-family:'Outfit',sans-serif;font-weight:700;font-size:1.15rem;
  letter-spacing:-.024em;line-height:1.25;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mini-v.up{color:var(--green)}
.mini-v.down{color:var(--red)}
.mini-l{font-size:.76rem;color:var(--tx3);margin-top:3px;line-height:1.35}

/* Jauge de couverture du stock */
/* margin-top:auto pousse la jauge et le pied en bas du panneau : les deux
   panneaux de tete ont la meme hauteur, leurs bas de bloc s'alignent. */
.gauge{margin-top:auto;padding-top:20px}
.gauge-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.gauge-hd .gl{font-size:.8rem;color:var(--tx2)}
.gauge-hd .gv{font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem}
.gauge-scale{display:flex;justify-content:space-between;margin-top:6px;font-size:.7rem;color:var(--tx3)}
.hero-foot{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--bd);
  font-size:.8rem;color:var(--tx3);
}

/* Liste des dettes en deux colonnes : avec une vingtaine de creances,
   une carte pleine largeur par dette obligeait a defiler sans fin. */
.debt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px;align-items:start}
.debt-list .card{margin-bottom:0}

/* --- CARTES STATISTIQUES --- */
/* Valeur d'abord, legende ensuite, icone discrete en haut a droite : on
   scanne la colonne des chiffres sans que l'icone ne prenne le dessus.
   Le filet de couleur en tete n'apparait qu'au survol : sept filets
   permanents transformeraient la rangee en arc-en-ciel. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:14px;margin-bottom:22px}
.st{
  position:relative;
  background:var(--gS2);border:1px solid var(--bd);border-radius:var(--r);
  padding:18px 20px 16px;box-shadow:var(--sh),var(--shIn);
  transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr);
}
.st::after{
  content:"";position:absolute;left:14px;right:14px;top:0;height:2px;
  border-radius:var(--rF);background:var(--tx3);
  opacity:0;transition:opacity var(--tr);
}
.st:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:var(--shH),var(--shIn)}
.st:hover::after{opacity:.9}

.st-ico{
  position:absolute;top:16px;right:16px;
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:10px;
}
.st-ico svg{width:16px;height:16px}
.st-v{
  font-family:'Outfit',sans-serif;font-weight:700;
  font-size:1.7rem;line-height:1.18;letter-spacing:-.036em;color:var(--tx);
  padding-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.st-l{font-size:.79rem;color:var(--tx3);margin-top:4px;line-height:1.4}

/* Imbriquee dans une carte, la tuile se creuse au lieu de se poser :
   blanc sur blanc, le decoupage ne se lirait pas. Elle se resserre
   aussi, pour tenir a plusieurs dans une demi-largeur de page. */
.card .stats,.panel .stats{grid-template-columns:repeat(auto-fit,minmax(142px,1fr));margin-bottom:18px}
.card .st,.panel .st{background:var(--gS3);box-shadow:none}
.card .st:hover,.panel .st:hover{box-shadow:var(--sh)}

.st.gold  .st-ico{background:var(--gold-bg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-bd)}
.st.green .st-ico{background:var(--green-bg);color:var(--green);box-shadow:inset 0 0 0 1px var(--green-bd)}
.st.red   .st-ico{background:var(--red-bg);color:var(--red);box-shadow:inset 0 0 0 1px var(--red-bd)}
.st.blue  .st-ico{background:var(--blue-bg);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-bd)}
.st.gold::after {background:var(--gold)}
.st.green::after{background:var(--green)}
.st.red::after  {background:var(--red)}
.st.blue::after {background:var(--blue)}

/* --- BADGES --- */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 11px;border-radius:var(--rF);border:1px solid transparent;
  font-size:.75rem;font-weight:600;white-space:nowrap;line-height:1.5;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge-plain::before{display:none}
.badge-green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.badge-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.badge-blue{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}
.badge-gold{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold-h)}
.badge-gray{background:var(--bgI);border-color:var(--bd);color:var(--tx2)}
.stars{color:var(--gold);font-size:.78rem;letter-spacing:1px}

/* --- BARRE DE PROGRESSION --- */
.prog{
  height:8px;border-radius:var(--rF);background:var(--bgI);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(46,35,22,.07);
}
.prog-fill{
  height:100%;border-radius:var(--rF);
  background:linear-gradient(90deg,var(--green-l),var(--green));
  transition:width .6s cubic-bezier(.22,1,.36,1);
}
.prog-fill.gold{background:linear-gradient(90deg,var(--gold-l),var(--gold))}
.prog-fill.red{background:linear-gradient(90deg,var(--red-l),var(--red))}
.prog-fill.blue{background:linear-gradient(90deg,var(--blue-l),var(--blue))}
.prog-lbl{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--tx2);margin-bottom:7px}

/* --- MODALE --- */
/* Le flou de l'arriere-plan detache la modale de la page sans avoir a
   assombrir l'ecran davantage. */
.modal-ov{
  position:fixed;inset:0;background:var(--bgM);z-index:500;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn var(--tr);
}
.modal{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rL);
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shL);
  animation:modalIn .26s cubic-bezier(.22,1,.36,1);
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 26px 16px;
  position:sticky;top:0;background:var(--bg2);z-index:1;
  border-bottom:1px solid var(--bd);border-radius:var(--rL) var(--rL) 0 0;
}
.modal-hd h3{font-size:1.1rem;margin:0}
.modal-x{
  background:none;border:none;font-size:1.35rem;cursor:pointer;color:var(--tx3);
  line-height:1;padding:2px 9px;border-radius:var(--rXS);
  transition:color var(--tr),background var(--tr);
}
.modal-x:hover{color:var(--tx);background:var(--bgI)}
.modal-bd{padding:22px 26px}
.modal-ft{
  display:flex;gap:10px;justify-content:flex-end;
  padding:16px 26px 22px;margin:22px -26px -22px;
  border-top:1px solid var(--bd);background:var(--gS3);
  border-radius:0 0 var(--rL) var(--rL);
}

/* --- TOASTS --- */
.toast-box{position:fixed;top:18px;right:18px;z-index:600;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:11px;
  padding:13px 17px;border-radius:var(--r);
  font-size:.89rem;font-weight:500;color:#fff;
  box-shadow:var(--shL);border:1px solid rgba(255,255,255,.14);
  pointer-events:auto;animation:toastIn .28s cubic-bezier(.22,1,.36,1);
  max-width:380px;
}
.toast svg{width:18px;height:18px;opacity:.95}
.toast.out{opacity:0;transform:translateX(16px);transition:opacity .25s,transform .25s}
.toast-ok{background:linear-gradient(180deg,#2C7551,#215A3E)}
.toast-err{background:linear-gradient(180deg,#B93B2C,#95291D)}
.toast-info{background:linear-gradient(180deg,#2A69A4,#1F5183)}

/* --- PILLS DE FILTRE --- */
/* Selection en aplat d'encre : lisible d'un coup d'oeil, et l'or reste
   disponible pour les actions. */
.pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.pill{
  position:relative;overflow:hidden;
  padding:6px 15px;border-radius:var(--rF);
  border:1px solid var(--bd);background:var(--gS2);color:var(--tx2);
  font-size:.83rem;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:var(--sh);
  transition:background var(--tr),color var(--tr),border-color var(--tr),box-shadow var(--tr);
}
.pill:hover{border-color:var(--bd2);color:var(--tx);background:var(--bg2)}
.pill.active{
  background:var(--tx);border-color:var(--tx);color:var(--bg2);
  box-shadow:0 4px 12px -5px rgba(46,35,22,.5);
}
.pill.active:hover{filter:brightness(1.25)}

/* --- SQUELETTES DE CHARGEMENT --- */
.sk{
  background:linear-gradient(90deg,var(--bgI) 25%,var(--bd) 50%,var(--bgI) 75%);
  background-size:800px 100%;border-radius:var(--rS);
  animation:shimmer 1.4s linear infinite;
}
.sk-line{height:11px;margin-bottom:9px}
.sk-line.w40{width:40%}
.sk-line.w60{width:60%}
.sk-line.w80{width:80%}
.sk-st{height:96px;border-radius:var(--r)}
.sk-block{height:190px;border-radius:var(--r)}

/* ===== css/forms.css ===== */
/* =====================================================================
   FORMULAIRES — champs, selects, textareas, barre de recherche

   Un champ au repos est creux : fond legerement plus sombre que la carte
   et ombre interieure d'un pixel. Au focus il se remplit de blanc et
   prend le halo dore. La saisie devient ainsi le point le plus clair de
   l'ecran, la ou se trouve l'attention.
   ===================================================================== */
.form-g{margin-bottom:16px}
.form-g label{
  display:block;font-size:.8rem;font-weight:600;
  color:var(--tx2);margin-bottom:7px;letter-spacing:.008em;
}
.form-g input,.form-g select,.form-g textarea{
  width:100%;padding:11px 13px;
  border:1px solid var(--bd2);border-radius:var(--rS);
  background:var(--bgI);color:var(--tx);outline:none;
  box-shadow:inset 0 1px 2px rgba(46,35,22,.05);
  transition:border-color var(--tr),box-shadow var(--tr),background var(--tr);
}
.form-g input::placeholder,.search-bar input::placeholder{color:var(--tx3)}
.form-g input:hover,.form-g select:hover,.form-g textarea:hover{border-color:var(--tx3)}
.form-g input:focus,.form-g select:focus,.form-g textarea:focus{
  border-color:var(--gold);background:var(--bg2);
  box-shadow:var(--shF),inset 0 1px 2px rgba(46,35,22,.03);
}
.form-g textarea{resize:vertical;min-height:72px;line-height:1.5}
.form-g input[type="date"]{cursor:pointer}
.form-g input[type="file"]{padding:9px;box-shadow:none}

/* Chevron dessine en CSS : le triangle natif de Chrome ne suit ni la
   couleur du texte ni le theme sombre. */
.form-g select{
  appearance:none;-webkit-appearance:none;
  padding-right:36px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),
                   linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-hint{font-size:.78rem;color:var(--tx3);margin-top:6px;line-height:1.5}

/* --- Barre de recherche --- */
.search-bar{position:relative;margin-bottom:18px;max-width:380px}
.search-bar input{
  width:100%;padding:11px 14px 11px 39px;
  border:1px solid var(--bd2);border-radius:var(--rF);
  background:var(--bgI);color:var(--tx);outline:none;
  box-shadow:inset 0 1px 2px rgba(46,35,22,.05);
  transition:border-color var(--tr),box-shadow var(--tr),background var(--tr);
}
.search-bar input:hover{border-color:var(--tx3)}
.search-bar input:focus{
  border-color:var(--gold);background:var(--bg2);
  box-shadow:var(--shF),inset 0 1px 2px rgba(46,35,22,.03);
}
.search-bar svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--tx3);pointer-events:none;
  transition:color var(--tr);
}
.search-bar input:focus+svg,.search-bar:focus-within svg{color:var(--gold)}

/* ===== css/tables.css ===== */
/* =====================================================================
   TABLEAUX — lignes aerees, filets fins, en-tete discret

   Le conteneur .tbl-wrap absorbe le debordement horizontal pour que la
   page elle-meme ne defile jamais lateralement.

   L'en-tete est colle en haut et legerement teinte : sur une longue
   liste, on garde le nom des colonnes sous les yeux sans avoir a poser
   un trait epais.
   ===================================================================== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

table{width:100%;border-collapse:collapse;font-size:.89rem}

thead th{
  position:sticky;top:0;z-index:1;
  background:var(--gS3);
  text-align:left;padding:13px 16px;
  font-family:'Outfit',sans-serif;
  font-weight:600;color:var(--tx3);font-size:.71rem;
  text-transform:uppercase;letter-spacing:.09em;
  border-bottom:1px solid var(--bd);white-space:nowrap;
}

td{padding:14px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr{transition:background var(--tr)}
tbody tr:nth-child(even){background:var(--bgZ)}
tbody tr:hover{background:var(--gold-bg)}
tbody tr:last-child td{border-bottom:none}

/* Dans une carte a bord franc (.card-flat), les cellules de rive
   s'alignent sur la marge interieure des autres cartes. */
.card-flat th:first-child,.card-flat td:first-child{padding-left:24px}
.card-flat th:last-child,.card-flat td:last-child{padding-right:24px}

/* Alignements utilitaires, pour eviter le style inline dans les gabarits */
.ta-r{text-align:right}
.nowrap{white-space:nowrap}
.muted{color:var(--tx3)}
.row-off{opacity:.5}
.row-off:hover{opacity:.85}

/* Cellule secondaire sous un libelle principal */
.cell-sub{display:block;color:var(--tx3);font-size:.77rem;line-height:1.35;margin-top:2px}

/* ===== css/pages.css ===== */
/* =====================================================================
   PAGES — styles propres a un ecran : connexion, graphique, carte du
   jour (stock), dettes, repartition des depenses, parametres
   ===================================================================== */

/* --- CONNEXION --- */
/* Un seul objet au centre d'un fond profond : la carte est le seul point
   clair de l'ecran, on ne peut regarder ailleurs. */
.login-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:24px;position:relative;z-index:300;
  background:
    radial-gradient(ellipse 80% 60% at 50% -12%,var(--gold-bg),transparent 66%),
    radial-gradient(ellipse 70% 55% at 50% 112%,var(--gold-bg),transparent 64%),
    var(--bg);
}
.login-card{
  position:relative;overflow:hidden;
  width:100%;max-width:392px;
  background:var(--gS2);border:1px solid var(--bd);border-radius:var(--rL);
  padding:42px 36px 34px;box-shadow:var(--shL),var(--shIn);text-align:center;
  animation:fadeUp .42s cubic-bezier(.22,1,.36,1);
}
/* Filet d'or en tete de carte, degrade sur les bords : signe la marque
   sans ajouter de bloc de couleur. */
.login-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.login-logo{
  width:58px;height:58px;margin:0 auto 20px;
  filter:drop-shadow(0 8px 18px var(--gold-glow));
}
.login-card h1{margin-bottom:6px;font-size:1.65rem}
.login-card p{color:var(--tx3);margin-bottom:30px;font-size:.9rem}
.login-card .form-g{text-align:left;margin-bottom:14px}
.login-err{color:var(--red);font-size:.83rem;margin:2px 0 8px;min-height:1.2em}
.btn-login{
  width:100%;padding:13px;border:1px solid var(--gold-d);border-radius:var(--rS);
  background:var(--gold-gr);color:var(--txInv);cursor:pointer;margin-top:10px;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:.98rem;
  letter-spacing:.01em;box-shadow:var(--shBtn);
  transition:background var(--tr),box-shadow var(--tr),transform var(--tr);
}
.btn-login:hover{
  background:var(--gold-gr-h);
  box-shadow:0 8px 22px -8px var(--gold-glow),var(--shBtn);
  transform:translateY(-1px);
}
.btn-login:active{transform:translateY(1px)}
.btn-login[disabled]{opacity:.6;cursor:default;transform:none;box-shadow:var(--shBtn)}

/* --- NAVIGATION PAR MOIS --- */
.mo-nav{
  display:inline-flex;align-items:center;gap:4px;
  margin-bottom:20px;padding:4px;
  background:var(--gS2);border:1px solid var(--bd);border-radius:var(--rF);
  box-shadow:var(--sh),var(--shIn);
}
.mo-nav span{
  font-family:'Outfit',sans-serif;font-weight:600;font-size:.92rem;
  min-width:150px;text-align:center;text-transform:capitalize;
  letter-spacing:-.008em;
}
.mo-nav .btn-g{border-radius:50%;width:32px;height:32px;padding:0;font-size:.9rem}
.mo-nav .btn-g:hover{background:var(--gold-bg);color:var(--gold-h)}

/* --- GRAPHIQUE DES VENTES --- */
/* Trois repères horizontaux et une ligne de base : sans eux, l'oeil n'a
   aucun moyen de comparer deux barres eloignees. */
.chart-plot{position:relative;height:212px;padding-top:26px}
.chart-lines{
  position:absolute;left:0;right:0;top:26px;bottom:0;
  display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;
}
.chart-lines i{display:block;border-top:1px dashed var(--bd)}
.chart-lines i:last-child{border-top:1px solid var(--bd2)}

.chart-cols{position:relative;height:100%;display:flex;align-items:flex-end;gap:10px}
.chart-col{
  flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;
  border-radius:var(--rS) var(--rS) 0 0;transition:background var(--tr);
}
.chart-col:hover{background:var(--gold-bg)}
.chart-bar{
  position:relative;width:100%;max-width:40px;min-height:3px;
  border-radius:7px 7px 2px 2px;
  background:linear-gradient(180deg,var(--gold-l) 0%,var(--gold) 100%);
  box-shadow:0 4px 12px -6px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.32);
  transition:height .5s cubic-bezier(.22,1,.36,1),filter var(--tr),box-shadow var(--tr);
  animation:growBar .55s cubic-bezier(.22,1,.36,1);
}
.chart-col:hover .chart-bar{filter:brightness(1.07);box-shadow:0 8px 18px -8px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.32)}
.chart-bar.zero{background:var(--bd2);box-shadow:none}
.chart-v{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  margin-bottom:7px;font-size:.74rem;font-weight:600;color:var(--tx2);
  transition:color var(--tr);
}
.chart-col:hover .chart-v{color:var(--tx)}

.chart-axis{display:flex;gap:10px;margin-top:11px}
.chart-axis span{
  flex:1;text-align:center;font-size:.75rem;
  color:var(--tx3);text-transform:capitalize;
}
.chart-axis span.is-today{color:var(--gold-h);font-weight:600}

/* --- ETATS VIDES --- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:56px 20px;color:var(--tx2);
}
.empty-ico{
  display:flex;align-items:center;justify-content:center;
  width:58px;height:58px;margin-bottom:18px;border-radius:var(--r);
  background:var(--gS3);color:var(--tx3);
  border:1px solid var(--bd);box-shadow:var(--sh);
}
.empty-ico svg{width:24px;height:24px}
.empty h4{font-size:1.04rem;color:var(--tx);margin-bottom:6px}
.empty p{font-size:.88rem;color:var(--tx3);max-width:36ch;line-height:1.55}
.empty .btn{margin-top:20px}
.empty-sm{padding:30px 16px}
.empty-sm .empty-ico{width:44px;height:44px;margin-bottom:12px;border-radius:var(--rS)}
.empty-sm .empty-ico svg{width:19px;height:19px}

/* --- STOCK : la journee en cours --- */
/* Le seul bloc a filet dore de l'application : c'est la carte qu'on vient
   remplir chaque matin. */
.today{
  position:relative;overflow:hidden;
  background:var(--gS2);border:1px solid var(--gold-bd);border-radius:var(--rL);
  padding:26px 28px;box-shadow:var(--sh),var(--shIn);margin-bottom:16px;
}
.today::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(560px 240px at 0% 0%,var(--gold-bg),transparent 62%);
}
.today>*{position:relative}
.today h3{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.today h3 svg{
  width:16px;height:16px;color:var(--gold);
  padding:6px;box-sizing:content-box;border-radius:9px;
  background:var(--bg2);box-shadow:inset 0 0 0 1px var(--gold-bd);
}
.today-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.today-item{
  padding:15px 17px;background:var(--gS3);
  border:1px solid var(--bd);border-radius:var(--r);
  transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr);
}
.today-item:hover{border-color:var(--bd2);box-shadow:var(--sh);transform:translateY(-1px)}
.today-item .tl{display:block;font-size:.76rem;color:var(--tx3)}
.today-item .tv{
  display:block;margin-top:4px;
  font-family:'Outfit',sans-serif;font-size:1.55rem;font-weight:700;
  letter-spacing:-.036em;line-height:1.1;
}
.today-item.hl{background:var(--gold-bg);border-color:var(--gold-bd)}
.today-item.hl .tv{color:var(--gold-h)}
.today-actions{display:flex;gap:10px;flex-wrap:wrap}

/* --- DETTES --- */
.debt-hd{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.debt-name{font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:-.018em}
.debt-meta{color:var(--tx3);font-size:.83rem;margin-top:3px}
.debt-amt{text-align:right}
.debt-amt .rem{
  font-family:'Outfit',sans-serif;font-weight:700;font-size:1.3rem;
  letter-spacing:-.032em;margin-top:6px;
}
.debt-amt .tot{color:var(--tx3);font-size:.79rem}
.debt-prog{margin-top:18px}

/* Historique des reglements, en fil vertical */
.pay-list{margin-top:16px;padding-left:16px;border-left:2px solid var(--bd)}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;font-size:.86rem}
.pay-row .pay-amt{font-weight:600;color:var(--green);white-space:nowrap}
.pay-row .pay-date{color:var(--tx3);font-size:.8rem;text-align:right}
.debt-actions{margin-top:18px;display:flex;gap:8px;align-items:center}

/* --- DEPENSES : repartition par categorie --- */
.cat-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-row .cat-name{flex-shrink:0;min-width:118px;font-size:.88rem}
.cat-row .prog{flex:1}
.cat-row .cat-amt{flex-shrink:0;font-weight:600;font-size:.88rem;min-width:104px;text-align:right}

/* --- CLIENTS : poids de chaque type dans la demande --- */
/* Meme grammaire que la repartition des depenses : un libelle, une barre
   proportionnelle, un montant aligne a droite. La ligne du type filtre
   est surlignee et marquee d'une reglette d'or a gauche, comme l'onglet
   actif de la sidebar — meme signe pour la meme idee. */
.type-row{
  position:relative;display:flex;align-items:center;gap:14px;
  padding:12px;margin:0 -12px;
}
.type-row+.type-row{border-top:1px solid var(--bd)}
.type-row.is-sel{background:var(--gold-bg)}
.type-row.is-sel::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--gold);border-radius:0 var(--rF) var(--rF) 0;
}
.type-row .t-name{flex-shrink:0;min-width:200px;display:flex;align-items:center;gap:9px}
.type-row .t-name .muted{font-size:.79rem;white-space:nowrap}
.type-row .prog{flex:1}
.type-row .t-amt{
  flex-shrink:0;min-width:168px;text-align:right;
  font-weight:600;font-size:.88rem;line-height:1.35;
}
.type-row .t-amt .muted{display:block;font-weight:400;font-size:.78rem}

.type-total{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);
  font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;
}

/* --- DEUX CARTES COTE A COTE --- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big-n{
  font-family:'Outfit',sans-serif;font-size:2.2rem;font-weight:700;
  line-height:1.06;letter-spacing:-.042em;
}
.big-n small{font-size:.95rem;color:var(--tx3);font-weight:400;letter-spacing:0}
.big-sub{color:var(--tx3);font-size:.82rem;margin-top:5px}
.big-sub+.prog{margin-top:16px}

/* --- PARAMETRES --- */
/* Une carte de reglages porte souvent plusieurs actions de nature
   differente. Les .set-group les separent par un filet plutot que par
   des cartes supplementaires : le bloc reste un seul objet a l'ecran. */
.set-group+.set-group{margin-top:22px;padding-top:20px;border-top:1px solid var(--bd)}
.set-group .eyebrow{display:block;margin-bottom:6px}
.set-group .set-hint{
  font-size:.86rem;color:var(--tx2);line-height:1.55;
  margin-bottom:14px;max-width:64ch;
}
.set-mo{margin-bottom:14px}
.set-mo .form-g{margin-bottom:0;max-width:260px}

/* Sept blocs empiles sur toute la largeur laissaient les deux tiers de
   l'ecran vides a droite. Au-dela de 1200 px, ils se rangent en
   colonnes ; en dessous, ils reprennent leur pile naturelle. */
@media(min-width:1200px){
  #pg-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px;align-items:start}
  #pg-settings>.pg-hd{grid-column:1/-1}
  #pg-settings>.card{margin-bottom:0}
  /* Le bloc d'export porte trois familles d'actions : il prend la ligne
     entiere, les autres se rangent deux par deux en dessous. */
  #pg-settings>.card-wide{grid-column:1/-1}
}

.btn-group{display:flex;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:6px}
.dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.export-area{
  width:100%;height:220px;padding:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;
  background:var(--bgI);color:var(--tx);line-height:1.55;
  border:1px solid var(--bd);border-radius:var(--rS);resize:vertical;
  box-shadow:inset 0 1px 2px rgba(46,35,22,.05);
}

/* ===== css/responsive.css ===== */
/* =====================================================================
   RESPONSIVE — charge en dernier pour surcharger tous les autres fichiers
   sans avoir a jouer sur la specificite des selecteurs.

   L'ordre va du plus large au plus etroit. Les marges interieures de la
   zone principale sont deja fluides (clamp dans layout.css) : on ne les
   redefinit ici que la ou la mise en page change vraiment de forme.
   ===================================================================== */

/* A partir du format bureau, une tuile d'indicateur cesse de s'etirer :
   au-dela de ~340 px, elle n'affiche pas plus, elle ecarte seulement sa
   valeur de son icone.

   Flex et non grid ici : avec grid, le nombre de colonnes de auto-fit se
   calcule sur la borne HAUTE de minmax(), si bien que plafonner la tuile
   reduit la rangee — quatre tuiles se cassaient en 3 + 1. En flex, la
   rangee se remplit sur la borne basse puis chaque tuile grandit jusqu'a
   son plafond : quatre tiennent sur une ligne, trois se rangent a gauche
   au lieu de traverser l'ecran. */
@media(min-width:1100px){
  .stats{display:flex;flex-wrap:wrap;align-items:stretch}
  .stats>.st{flex:1 1 190px;max-width:340px}
  .card .stats>.st,.panel .stats>.st{flex-basis:142px;max-width:260px}

  /* Une barre de repartition longue de 900 px ne se compare pas mieux
     qu'une barre de 600 : on borne la ligne. */
  .cat-row{max-width:940px}
}

/* Tres grand ecran : on desserre le rythme plutot que d'etirer le texte. */
@media(min-width:1700px){
  .hero,.duo{gap:22px}
  .stats{gap:18px}
  .stats>.st{flex-basis:210px;max-width:380px}
  .card{padding:26px 28px}
}

@media(max-width:1080px){
  .hero{grid-template-columns:1fr}
}

@media(max-width:900px){
  .duo{grid-template-columns:1fr}
  .today-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:768px){
  .hamburger{display:flex}
  .side{transform:translateX(-100%);box-shadow:var(--shL)}
  .side.open{transform:translateX(0)}
  .side-overlay.open{display:block}
  .main{margin-left:0;padding:66px 16px 44px}

  h1{font-size:1.6rem}
  .pg-hd{margin-bottom:20px;padding-bottom:14px}
  .card{padding:18px;border-radius:var(--r)}
  .panel,.today{padding:20px;border-radius:var(--r)}
  .hero-v{font-size:2.15rem}
  .hero-split{gap:12px}

  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}

  .pg-hd{flex-direction:column;align-items:stretch;gap:12px}
  .pg-hd .pg-sub{align-self:flex-start}
  .pg-hd .btn{width:100%}
  .search-bar{max-width:none}
  .mo-nav{display:flex;width:100%;justify-content:space-between}
  .mo-nav span{min-width:0;flex:1}

  .toast-box{top:auto;bottom:16px;left:16px;right:16px}
  .toast{max-width:none}

  .cat-row{gap:10px}
  .cat-row .cat-name{min-width:86px;font-size:.83rem}
  .cat-row .cat-amt{min-width:88px;font-size:.83rem}

  /* La barre proportionnelle passe a la ligne : sur 390 px, un libelle,
     une barre et un total cote a cote ne laissent plus rien de lisible. */
  .type-row{flex-wrap:wrap;gap:8px 12px}
  .type-row .t-name{min-width:0;flex:1}
  .type-row .t-amt{min-width:0;text-align:right}
  .type-row .prog{flex:1 0 100%;order:3}
  .type-total{flex-direction:column;align-items:flex-start;gap:4px}

  /* Plutot que de comprimer les colonnes jusqu'a couper les noms en deux,
     le tableau garde une largeur lisible et .tbl-wrap le fait defiler. */
  .tbl-wrap table{min-width:580px}
  .card-flat th:first-child,.card-flat td:first-child{padding-left:18px}
  .card-flat th:last-child,.card-flat td:last-child{padding-right:18px}

  .modal-ft{margin:18px -20px -18px;padding:14px 20px 18px}
  .modal-bd{padding:18px 20px}
  .modal-hd{padding:18px 20px 14px}
}

@media(max-width:430px){
  .st{padding:16px 18px 14px}
  .st-v{font-size:1.55rem}
  .hero-split{grid-template-columns:1fr;gap:14px}
  .btn-group .btn{width:100%}
  .login-card{padding:32px 22px 26px}
}

/* Une seule colonne de tuiles seulement sur les tres petits ecrans : sur
   un telephone courant (375-430 px), deux tuiles par ligne tiennent sans
   se serrer et evitent d'avoir a defiler cinq ecrans avant la liste. */
@media(max-width:359px){
  .stats{grid-template-columns:1fr}
  .today-grid{grid-template-columns:1fr}
}
</style>
</head>

     ===================================================================== -->
<div id="app" class="app" hidden>

      <span class="bt">
        <span class="bn">Nenu Jolof</span>
        <span class="bs">Suivi des ventes</span>
      </span>
    </div>

    <ul class="nav-list">
      <li class="nav-item active" data-p="dashboard" onclick="nav('dashboard')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6.5" height="6.5" rx="1.5"/><rect x="11.5" y="2" width="6.5" height="6.5" rx="1.5"/><rect x="2" y="11.5" width="6.5" height="6.5" rx="1.5"/><rect x="11.5" y="11.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Tableau de bord</span></li>

      <li class="nav-sec">Commercial</li>
      <li class="nav-item" data-p="clients" onclick="nav('clients')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M2.5 17v-1a4 4 0 014-4h3a4 4 0 014 4v1"/><path d="M14.5 4.4a3 3 0 010 5.2M15.5 12.3a4 4 0 012 3.4V17"/></svg><span>Clients</span></li>

/* ===== js/core/state.js ===== */

/* Lecture du cache navigateur. Une donnee illisible ne doit jamais

function load() {

/* Sauvegarde : cache local d'abord (instantane), cloud ensuite (asynchrone).

}

/* Ecrit le cache local sans declencher de synchro cloud. Utilise quand la

  } catch (e) { /* quota plein : le cloud reste la source de verite */ }

/* Vrai si l'etat courant contient au moins une donnee saisie */
function hasData(o) {

  if (!d) return false;
  return !!(
    (d.clients    || []).length ||
    (d.debts      || []).length ||
    (d.expenses   || []).length ||

/* ===== js/core/utils.js ===== */
/* =====================================================================
   UTILITAIRES — identifiants, formatage, dates, echappement HTML
   ===================================================================== */

/* Identifiant court, unique en pratique pour un usage mono-utilisateur */
function gid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

/* Montant en francs CFA, separateurs a la francaise */
function cfa(n) {
  if (n == null || isNaN(n)) return '0 FCFA';
  return new Intl.NumberFormat('fr-FR').format(Math.round(n)) + ' FCFA';
}

/* Nombre entier separe par milliers, sans devise */
function num(n) {
  if (n == null || isNaN(n)) return '0';
  return new Intl.NumberFormat('fr-FR').format(Math.round(n));
}

/* Date ISO (AAAA-MM-JJ) vers « 11 févr. 2026 ».
   Le T12:00:00 evite qu'un decalage de fuseau ne recule d'un jour. */
function fmtD(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

/* Date du jour au format ISO, en heure locale */
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* Mois courant au format AAAA-MM */
function curMo() {
  return today().substring(0, 7);
}

/* AAAA-MM vers « février 2026 » */
function moLabel(ym) {
  const [y, m] = ym.split('-');
  return new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}

/* Echappement HTML. A appliquer a TOUTE donnee saisie par l'utilisateur
   avant de l'inserer dans un gabarit : noms, adresses, notes, libelles. */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Pourcentage borne a [0,100], pour les barres de progression */
function pct(part, whole) {
  if (!whole) return 0;
  return Math.max(0, Math.min(100, (part / whole) * 100));
}

/* Accord du pluriel : plur(3,'client') -> « clients » */
function plur(n, word, suffix) {
  return word + (n > 1 ? (suffix || 's') : '');
}

/* Valeur d'un champ de formulaire, deja debarrassee des espaces */
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

/* Valeur numerique d'un champ, ou NaN si le champ est vide ou invalide */
function numVal(id) {
  const el = document.getElementById(id);
  if (!el || el.value === '') return NaN;
  return parseFloat(el.value);
}

/* ===== js/core/supabase.js ===== */
/* =====================================================================
   SYNCHRONISATION CLOUD — Supabase
   Modele : le localStorage est le cache de lecture rapide, Supabase la
   sauvegarde de reference. Chaque save() ecrit les deux.
   ===================================================================== */

let sb = null;          /* client Supabase */
let cloudOK = false;    /* derniere operation reseau reussie ? */
let lastSync = null;    /* Date de la derniere ecriture reussie */

/* Cree le client. Appele avant la connexion, car l'ecran de login s'en sert. */
function initSb() {
  if (sb) return sb;
  try {
    sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  } catch (e) {
    console.warn('Client Supabase indisponible', e);
    setSync('off', 'Hors ligne');
  }
  return sb;
}

/* Envoie l'etat complet vers le cloud. Une seule ligne, id = 1. */
async function cloudPush() {
  if (!sb) { setSync('off', 'Hors ligne'); return false; }
  setSync('busy', 'Synchro...');
  try {
    const { error } = await sb.from('app_state').upsert({
      id: 1,
      data: S,
      updated_at: new Date().toISOString()
    });
    cloudOK = !error;
    if (error) {
      console.warn('Echec de la synchro vers le cloud', error);
      setSync('err', 'Non sauvegardé');
      return false;
    }
    lastSync = new Date();
    setSync('ok', 'Sauvegardé');
    return true;
  } catch (e) {
    cloudOK = false;
    console.warn('Echec de la synchro vers le cloud', e);
    setSync('err', 'Non sauvegardé');
    return false;
  }
}

/* Lit l'etat stocke dans le cloud. Renvoie null si rien n'est lisible. */
async function cloudPull() {
  if (!sb) return null;
  setSync('busy', 'Lecture...');
  try {
    const { data, error } = await sb.from('app_state').select('data').eq('id', 1).single();
    cloudOK = !error;
    if (error) {
      console.warn('Echec de la lecture du cloud', error);
      setSync('err', 'Cloud injoignable');
      return null;
    }
    setSync('ok', 'Sauvegardé');
    return data && data.data ? data.data : null;
  } catch (e) {
    cloudOK = false;
    setSync('err', 'Cloud injoignable');
    return null;
  }
}

/* Bouton « Forcer la synchro » de la page Parametres */
async function syncNow() {
  const ok = await cloudPush();
  toast(ok ? 'Données synchronisées' : 'Échec de la synchro — vérifiez votre connexion', ok ? 'ok' : 'err');
  if (curPage === 'settings') render();
}

/* Bouton « Restaurer depuis le cloud » de la page Parametres */
async function cloudRestore() {
  const d = await cloudPull();
  if (d && hasData(d)) {
    S = Object.assign(defaults(), d);
    save();
    render();
    toast('Données restaurées depuis le cloud');
  } else {
    toast('Aucune donnée trouvée dans le cloud', 'err');
  }
}

/* Premiere synchro apres la connexion.
   Regle : le cloud ne remplace le cache local que si celui-ci est vide.
   Sinon c'est le local qui est pousse vers le cloud. Cette asymetrie evite
   d'ecraser une saisie faite hors ligne. */
async function initCloud() {
  try {
    if (!initSb()) return;
    const cloud = await cloudPull();
    const localHas = hasData(S);
    const cloudHas = hasData(cloud);

    if (cloudHas && !localHas) {
      S = Object.assign(defaults(), cloud);
      saveLocalOnly();
      render();
      toast('Données chargées depuis le cloud', 'ok');
    } else if (localHas) {
      cloudPush();
    }
  } catch (e) {
    cloudOK = false;
    console.warn('Echec de l initialisation du cloud', e);
    setSync('err', 'Cloud injoignable');
  }
}

/* Changement de mot de passe (page Parametres). Le mot de passe n'est
   jamais stocke ni verifie par ce fichier : Supabase s'en charge. */
async function changePassword() {

  const b = document.getElementById('pw2').value;
  if (a.length < 8) { toast('Le mot de passe doit faire au moins 8 caractères', 'err'); return; }

  if (!sb) { toast('Serveur injoignable', 'err'); return; }

  const { error } = await sb.auth.updateUser({ password: a });
  if (error) {
    toast('Impossible de changer le mot de passe', 'err');
    console.warn(error);
    return;
  }

  document.getElementById('pw2').value = '';

}

/* ===== js/core/auth.js ===== */
/* =====================================================================
   AUTHENTIFICATION
   Le mot de passe est verifie par Supabase, jamais par ce fichier. La
   session obtenue est ce qui donne acces aux donnees : sans elle, les
   regles RLS refusent toute lecture et toute ecriture.
   ===================================================================== */

async function doLogin() {
  const email = val('logEmail');
  const pass  = document.getElementById('logPass').value;
  const err   = document.getElementById('logErr');
  const btn   = document.getElementById('logBtn');

  if (!email || !pass) { err.textContent = 'Entrez votre email et votre mot de passe'; return; }
  if (!initSb()) { err.textContent = 'Serveur injoignable. Vérifiez votre connexion internet.'; return; }

  err.textContent = 'Connexion en cours...';
  btn.disabled = true;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) {
      err.textContent = /network|fetch/i.test(error.message)
        ? 'Serveur injoignable. Vérifiez votre connexion internet.'
        : 'Email ou mot de passe incorrect';
      return;
    }
    err.textContent = '';
    document.getElementById('logPass').value = '';
    curEmail = data && data.user ? data.user.email : email;
    cloudLoading = true;
    showApp();
    await initCloud();
    cloudLoading = false;
    render();
  } catch (ex) {
    err.textContent = 'Serveur injoignable. Vérifiez votre connexion internet.';
  } finally {
    btn.disabled = false;
  }
}

async function doLogout() {
  try { if (sb) await sb.auth.signOut(); } catch (e) { /* deconnexion locale quand meme */ }
  cloudOK = false;
  curEmail = '';
  document.getElementById('app').hidden = true;
  document.getElementById('loginScreen').hidden = false;
}

/* Bascule de l'ecran de connexion vers l'application */
function showApp() {
  document.getElementById('loginScreen').hidden = true;
  document.getElementById('app').hidden = false;
  nav('dashboard');
}

/* ===== js/core/backup.js ===== */
/* =====================================================================
   SAUVEGARDE — export JSON / CSV, import JSON, remise a zero
   L'export JSON est le format de reference : c'est le seul qui puisse
   etre reimporte tel quel. Les CSV servent a la lecture (tableur).
   ===================================================================== */

/* Prepare l'API de telechargement si l'environnement en propose une.
   Sinon, doSave() bascule sur le presse-papier puis sur une fenetre. */
async function initDL() {
  try {
    if (window.claude) DL = await claude.use('downloads');
  } catch (e) { /* pas de telechargement natif : les replis suffisent */ }
}

/* Serialise un tableau en CSV. Guillemets, virgules et retours a la ligne
   sont echappes selon la convention RFC 4180. */
function csvStr(headers, rows) {
  const cell = function (v) {
    const s = String(v ?? '');
    return (s.includes(',') || s.includes('"') || s.includes('\n'))
      ? '"' + s.replace(/"/g, '""') + '"'
      : s;
  };
  return [headers.join(','), ...rows.map(function (r) { return r.map(cell).join(','); })].join('\n');
}

/* Trois voies, de la meilleure a la plus rustique :
   telechargement natif, presse-papier, affichage dans une modale. */
async function doSave(filename, data) {
  if (DL) {
    try {
      await DL.save({ filename: filename, data: data });
      toast('Fichier exporté');
      return;
    } catch (e) {
      if (e.code === 'declined') return;
    }
  }
  try {
    await navigator.clipboard.writeText(data);
    toast('Copié dans le presse-papier (' + filename + ')', 'info');
  } catch (e) {
    openModal('Export — ' + filename,
      '<textarea class="export-area" readonly>' + esc(data) + '</textarea>'
      + '<div class="modal-ft"><button class="btn btn-p" onclick="closeModal()">Fermer</button></div>');
  }
}

function expJSON() {
  doSave('nenujolof_backup_' + today() + '.json',
    JSON.stringify({ version: 1, exported: new Date().toISOString(), data: S }, null, 2));
}

function expCSV(type) {
  if (type === 'clients') {
    doSave('clients.csv', csvStr(
      ['Nom', 'Téléphone', 'Statut', 'Client depuis', 'Ancienneté (mois)', 'Fidèle',
       "Raison inactivité", 'Type', 'Plateaux/semaine', 'Adresse', 'Notes'],
      S.clients.map(function (c) {
        return [c.name, c.phone, isActive(c) ? 'Actif' : 'Inactif',
                c.since || (c.createdAt || '').substring(0, 10), clientAge(c),
                isLoyal(c) ? 'Oui' : 'Non', c.inactiveReason || '', typeLabel(c),
                c.weeklyTrays || 0, c.address || '', c.notes || ''];
      })));

  } else if (type === 'expenses') {
    doSave('depenses.csv', csvStr(
      ['Date', 'Description', 'Catégorie', 'Montant'],
      S.expenses.map(function (e) { return [e.date, e.description, e.category, e.amount]; })));

  } else if (type === 'sales') {
    doSave('ventes.csv', csvStr(
      ['Date', 'Quantité', 'Prix vente', 'Prix revient', 'Marge'],
      S.sales.map(function (s) {
        return [s.date, s.quantity, s.sellingPrice, s.costPrice, (s.sellingPrice - s.costPrice) * s.quantity];
      })));

  } else if (type === 'debts') {
    doSave('dettes.csv', csvStr(
      ['Client', 'Date', 'Description', 'Montant', 'Réglé', 'Reste', 'Statut'],
      S.debts.map(function (d) {
        return [clientName(d.clientId), d.date, d.description || '', d.amount,
                debtPaid(d), Math.max(0, debtRemaining(d)),
                debtStatus(d) === 'soldee' ? 'Soldée' : 'En cours'];
      })));
  }
}

/* Import d'une sauvegarde JSON. Accepte le format enveloppe ({version,
   data}) comme l'objet brut, pour rester compatible avec les exports
   anciens. */
function doImport(input) {
  const f = input.files[0];
  if (!f) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const json = JSON.parse(e.target.result);
      const data = json.data || json;
      if (hasData(data) || data.clients || data.debts || data.expenses) {
        S = Object.assign(defaults(), data);
        save();
        render();
        toast('Données importées');
        rSettings();
      } else {
        toast('Format non reconnu', 'err');
      }
    } catch (err) {
      toast('Fichier JSON invalide', 'err');
    }
  };
  reader.readAsText(f);
  input.value = '';
}

/* ===== js/core/report.js ===== */
/* =====================================================================
   RAPPORTS PDF — documents imprimables

   Pourquoi pas une bibliotheque PDF ? Parce qu'elle viendrait d'un CDN.
   L'application s'ouvre en file:// et doit rester utilisable sans reseau :
   un bouton d'export qui ne marche que connecte n'est pas un export.

   On construit donc un document HTML complet dans une iframe cachee, avec
   sa propre feuille de style d'impression, et on appelle print(). Le
   navigateur propose « Enregistrer au format PDF » — le fichier obtenu est
   un vrai PDF, et le meme document part a l'imprimante si besoin.

   Les polices sont celles du systeme, volontairement : attendre Google
   Fonts avant d'imprimer donnerait un document nu si le reseau manque.
   ===================================================================== */

/* Feuille de style du document imprime. Pensee pour du A4 : marges de
   15 mm, corps a 10,5 pt, tableaux qui ne se coupent pas au milieu d'une
   ligne. */
function repCSS() {
  return `
    @page{size:A4;margin:15mm 14mm}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font:10.5pt/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      color:#1B1B1B;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .num{font-variant-numeric:tabular-nums}

    /* --- En-tete de document --- */
    .rep-hd{display:flex;align-items:flex-start;gap:14px;padding-bottom:12px;
            border-bottom:2px solid #B57F14;margin-bottom:22px}
    .rep-hd svg{width:42px;height:42px;flex-shrink:0}
    .rep-hd .bn{font-size:15pt;font-weight:700;letter-spacing:-.02em;line-height:1.1}
    .rep-hd .bs{font-size:8.5pt;color:#6B6052;margin-top:1px}
    .rep-hd .meta{margin-left:auto;text-align:right;font-size:8.5pt;color:#6B6052;line-height:1.5}
    .rep-hd .meta strong{display:block;font-size:12pt;color:#1B1B1B;letter-spacing:-.01em}

    /* --- Sections --- */
    h2{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
       color:#8A7F6F;margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid #DDD6C9}
    h2:first-of-type{margin-top:0}
    p.note{font-size:8.5pt;color:#6B6052;margin-top:7px;line-height:1.5}

    /* --- Tableaux --- */
    table{width:100%;border-collapse:collapse;font-size:9.5pt}
    th{text-align:left;padding:6px 8px;font-size:8pt;font-weight:700;
       text-transform:uppercase;letter-spacing:.05em;color:#6B6052;
       border-bottom:1px solid #C9C0B1;white-space:nowrap}
    td{padding:6px 8px;border-bottom:1px solid #EDE7DC;vertical-align:top}
    tr{page-break-inside:avoid}
    thead{display:table-header-group}
    .r{text-align:right}
    .muted{color:#6B6052}
    .pos{color:#1F6B44;font-weight:600}
    .neg{color:#A6301F;font-weight:600}
    tfoot td{border-top:1.5px solid #C9C0B1;border-bottom:none;font-weight:700;padding-top:8px}

    /* --- Bloc de synthese chiffree --- */
    .sum{width:100%;border-collapse:collapse;font-size:10.5pt}
    .sum td{padding:7px 0;border-bottom:1px solid #EDE7DC}
    .sum td.r{text-align:right;font-weight:600}
    .sum tr.rule td{border-bottom:1.5px solid #1B1B1B}
    .sum tr.big td{font-size:13pt;font-weight:700;padding-top:10px;border-bottom:none}
    .sum tr.big td.r{color:#8A5C08}
    /* Ces deux regles doivent suivre la precedente : un resultat negatif
       se lit en rouge, pas dans l'or de la marque. */
    .sum tr.big td.r.pos{color:#1F6B44}
    .sum tr.big td.r.neg{color:#A6301F}

    /* --- Cartouches --- */
    .kpis{display:flex;gap:10px;margin-bottom:4px}
    .kpi{flex:1;border:1px solid #DDD6C9;border-radius:6px;padding:9px 11px}
    .kpi .k{font-size:8pt;color:#6B6052;text-transform:uppercase;letter-spacing:.05em}
    .kpi .v{font-size:14pt;font-weight:700;letter-spacing:-.02em;margin-top:2px}

    .rep-ft{margin-top:26px;padding-top:9px;border-top:1px solid #DDD6C9;
            font-size:8pt;color:#8A7F6F;display:flex;justify-content:space-between}
    .empty-line{padding:14px 8px;color:#8A7F6F;font-size:9.5pt;font-style:italic}
  `;
}

    + '<stop offset="0" stop-color="#D8A139"/><stop offset="1" stop-color="#A5700E"/>'
