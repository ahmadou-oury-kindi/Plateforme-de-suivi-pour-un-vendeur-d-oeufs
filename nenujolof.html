  el.title = state === 'ok' && lastSync
    ? 'Dernière sauvegarde cloud à ' + lastSync.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : label;
}

/* ===== js/ui/counters.js ===== */
/* =====================================================================
   COMPTEURS ANIMES — les chiffres cles montent de 0 a leur valeur
   Appele uniquement depuis render(), c'est-a-dire a l'arrivee sur une
   page ou au changement de mois. Un simple clic sur un filtre ne relance
   pas l'animation : elle deviendrait fatigante.
   ===================================================================== */
const COUNT_MS = 620;

function animateCounts(root) {
  if (!root) return;

  /* Respecte le reglage systeme « moins d'animations » */
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  root.querySelectorAll('[data-count]').forEach(function (el) {
    const target = parseFloat(el.dataset.count);
    if (!isFinite(target) || target === 0) return;

    const finalText = el.textContent;   /* on restitue exactement ce texte a la fin */
    const fmt    = el.dataset.fmt || 'int';
    const suffix = el.dataset.suffix || '';
    const start  = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - start) / COUNT_MS);
      /* easeOutCubic : rapide au debut, freine a l'arrivee */
      const v = target * (1 - Math.pow(1 - t, 3));
      if (t < 1) {
        el.textContent = (fmt === 'cfa' ? cfa(v) : fmt === 'dec' ? v.toFixed(1) : num(v)) + suffix;
        requestAnimationFrame(frame);
      } else {
        el.textContent = finalText;
      }
    }
    el.textContent = (fmt === 'cfa' ? cfa(0) : fmt === 'dec' ? '0.0' : '0') + suffix;
    requestAnimationFrame(frame);
  });
}

/* ===== js/ui/ripple.js ===== */
/* =====================================================================
   ONDE AU CLIC — retour visuel sur les boutons
   Un seul ecouteur pose sur le document : les boutons crees plus tard
   par les renderers en beneficient sans avoir a etre cables.
   ===================================================================== */
function initRipple() {
  document.addEventListener('pointerdown', function (e) {
    const btn = e.target.closest('.btn, .btn-login, .pill');
    if (!btn) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const span = document.createElement('span');
    span.className = 'rip';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - r.left - size / 2) + 'px';
    span.style.top  = (e.clientY - r.top  - size / 2) + 'px';

    /* .pill et .btn-login n'ont pas overflow:hidden en CSS : on le pose ici
       pour que l'onde reste dans le bouton. */
    const prevPos = getComputedStyle(btn).position;
    if (prevPos === 'static') btn.style.position = 'relative';
    btn.style.overflow = 'hidden';

    btn.appendChild(span);
    setTimeout(function () { span.remove(); }, 520);
  });
}

/* ===== js/ui/nav.js ===== */
/* =====================================================================
   NAVIGATION — bascule entre les sept pages, sidebar mobile, mois affiche
   ===================================================================== */

/* Table page -> renderer. Ajouter une page = ajouter une ligne ici,
   un <div id="pg-..."> dans app.html et un <li> dans la sidebar. */
const PAGES = {
  dashboard: rDash,
  clients:   rClients,
  debts:     rDebts,
  expenses:  rExpenses,
  stock:     rStock,
  margins:   rMargins,
  settings:  rSettings
};

function nav(p) {
  curPage = p;
  document.querySelectorAll('.page').forEach(function (x) { x.hidden = true; });
  document.getElementById('pg-' + p).hidden = false;
  document.querySelectorAll('.nav-item').forEach(function (x) {
    x.classList.toggle('active', x.dataset.p === p);
  });
  render();
  if (window.innerWidth <= 768) closeSide();
}

/* Rend la page courante, puis relance l'animation d'entree et les
   compteurs. Les renderers appeles directement (clic sur un filtre)
   ne passent pas par ici et ne rejouent donc aucune animation. */
function render() {
  const fn = PAGES[curPage];
  if (!fn) return;
  fn();

  const el = document.getElementById('pg-' + curPage);
  if (!el) return;
  el.classList.remove('page-in');
  void el.offsetWidth;          /* force le navigateur a repartir de zero */
  el.classList.add('page-in');
  animateCounts(el);
}

/* Rejoue le renderer de la page courante, sans animation d'entree.

   Une saisie ne touche pas toujours la page ou elle a ete faite : une
   vente enregistree depuis Stock modifie Marges ET Stock. Le formulaire
   appelle donc refresh(), qui rafraichit l'ecran que l'utilisateur a
   sous les yeux, quel qu'il soit. */
function refresh() {
  const fn = PAGES[curPage];
  if (fn) fn();
}

/* Navigation par mois, partagee par Depenses, Stock et Marges */
function chgMonth(d) {
  const [y, m] = selMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + d, 1);
  selMonth = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  render();
}

/* --- Sidebar mobile --- */
function toggleSide() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sideOv').classList.toggle('open');
}

function closeSide() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sideOv').classList.remove('open');
}

/* ===== js/helpers/stock.js ===== */
/* =====================================================================
   HELPERS STOCK

   Regle de calcul, valable partout :

       stock = point de depart + receptions - ventes

   Le stock n'est jamais stocke, il se deduit des mouvements. Enregistrer
   une vente le fait donc baisser tout seul, enregistrer une reception le
   fait monter : il n'y a rien a ressaisir.

   Le point de depart est le dernier inventaire physique enregistre — le
   comptage du soir. Un inventaire fait foi sur tout ce qui le precede :
   c'est la que l'on remet le compteur sur la realite du magasin, casse et
   manquants compris. A defaut d'inventaire, le point de depart est le
   stock initial saisi au demarrage du suivi.

   Consequence : un inventaire cloture sa journee. Une vente saisie apres
   coup, a une date deja inventoriee, ne rebaisse pas le stock — c'est le
   comptage qui fait foi. Les pages previennent l'utilisateur dans ce cas
   pour qu'il corrige son inventaire.
   ===================================================================== */

/* Dernier inventaire connu a une date donnee.
   strict = true : on cherche AVANT la date, sans inclure ce jour-la. */
function lastInventory(date, strict) {
  const l = S.daily
    .filter(function (d) {
      if (d.closingStock == null) return false;
      return strict ? d.date < date : d.date <= date;
    })
    .sort(function (a, b) { return b.date.localeCompare(a.date); });
  return l[0] || null;
}

/* Inventaire d'une date precise, ou null */
function inventoryOn(date) {
  return S.daily.find(function (d) {
    return d.date === date && d.closingStock != null;
  }) || null;
}

/* Plateaux recus a une date donnee, toutes receptions confondues */
function getReceived(date) {
  return S.receptions
    .filter(function (r) { return r.date === date; })
    .reduce(function (s, r) { return s + r.quantity; }, 0);
}

/* Plateaux vendus un jour donne, d'apres les ventes enregistrees */
function getSold(date) {
  return S.sales
    .filter(function (s) { return s.date === date; })
    .reduce(function (s, x) { return s + x.quantity; }, 0);
}

/* Decomposition du calcul du stock theorique en fin de journee `date` :
   le point de depart, ce qui est entre, ce qui est sorti. Une seule
   fonction pour le calcul ET pour l'explication affichee a l'ecran —
   impossible que le detail montre a l'utilisateur diverge du total.

   Le point de depart est l'inventaire PRECEDENT, sans tenir compte d'un
   comptage fait ce jour-la : c'est justement la valeur a laquelle on
   compare ce comptage. */
function stockBasis(date) {
  const inv = lastInventory(date, true);
  let base, from, excl, label;

  if (inv) {
    base = inv.closingStock; from = inv.date; excl = true;
    label = 'Inventaire du ' + fmtD(inv.date);
  } else if (S.initialStock != null) {
    base = S.initialStock; from = S.initialStockDate; excl = false;
    label = 'Stock de départ';
  } else {
    base = 0; from = null; excl = false;
    label = 'Aucun point de départ';
  }

  function inRange(d) {
    if (d > date) return false;
    if (from == null) return true;
    return excl ? d > from : d >= from;
  }

  const received = S.receptions
    .filter(function (r) { return inRange(r.date); })
    .reduce(function (s, r) { return s + r.quantity; }, 0);
  const sold = S.sales
    .filter(function (x) { return inRange(x.date); })
    .reduce(function (s, x) { return s + x.quantity; }, 0);

  return { label: label, base: base, received: received, sold: sold,
           theo: base + received - sold };
}

/* Stock theorique en fin de journee : ce que le magasin devrait contenir
   si rien ne s'etait perdu. */
function theoreticalStock(date) {
  return stockBasis(date).theo;
}

/* Stock reel en fin de journee : le comptage du jour fait foi s'il existe */
function stockOn(date) {
  const inv = inventoryOn(date);
  return inv ? inv.closingStock : theoreticalStock(date);
}

/* Ecart releve le jour d'un inventaire : compte physique - theorique.
   Negatif = manquants (casse, oubli de saisie). null = pas d'inventaire. */
function stockGap(date) {
  const inv = inventoryOn(date);
  return inv ? inv.closingStock - theoreticalStock(date) : null;
}

/* Stock actuel, tel qu'il doit se trouver en magasin maintenant */
function getCurrentStock() {
  return stockOn(today());
}

/* Vrai si le suivi n'a pas encore de point de depart */
function needsInitialStock() {
  return S.initialStock == null && !lastInventory(today(), false);
}

/* Toutes les dates portant un mouvement ou un inventaire dans un mois,
   de la plus recente a la plus ancienne. Sert au journal quotidien : il
   ne se remplit plus a partir des seuls inventaires. */
function activeDates(mo) {
  const seen = {};
  function add(list) {
    list.forEach(function (x) { if (x.date.startsWith(mo)) seen[x.date] = true; });
  }
  add(S.receptions); add(S.sales);
  add(S.daily.filter(function (d) { return d.closingStock != null; }));
  return Object.keys(seen).sort(function (a, b) { return b.localeCompare(a); });
}

/* Derniere reception enregistree, toutes dates confondues */
function lastReception() {
  const l = [...S.receptions].sort(function (a, b) { return b.date.localeCompare(a.date); });
  return l[0] || null;
}

/* Prix de revient le plus recent, base de pre-remplissage des formulaires */
function getLatestCost() {
  const lr = lastReception();
  return lr ? lr.costPrice : 0;
}

/* Nombre de jours entre une date et aujourd'hui (positif = passe) */
function daysAgo(d) {
  return Math.round((new Date(today() + 'T12:00:00') - new Date(d + 'T12:00:00')) / 86400000);
}

function agoLabel(d) {
  const n = daysAgo(d);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'hier';
  return n > 0 ? 'il y a ' + n + ' jours' : 'dans ' + (-n) + ' jours';
}

/* Couleur d'alerte de la couverture de stock, en jours de consommation */
function coverTone(cover) {
  if (cover == null) return 'blue';
  if (cover < COVER_LOW) return 'red';
  if (cover < COVER_MID) return 'gold';
  return 'green';
}

/* ===== js/helpers/clients.js ===== */
/* =====================================================================
   HELPERS CLIENTS — type, statut, anciennete, demande hebdomadaire
   ===================================================================== */

/* Type du client, avec repli sur « Client final » si la valeur stockee
   n'est plus reconnue (ancienne donnee, faute de frappe). */
function clientType(c) {
  return TYPES.find(function (x) { return x.v === c.type; }) || TYPES[0];
}
function typeLabel(c) { return clientType(c).l; }
function typeBadge(c) {
  const t = clientType(c);
  return '<span class="badge ' + t.b + '">' + t.l + '</span>';
}
function typeOpts(sel) {
  return TYPES.map(function (x) {
    return '<option value="' + x.v + '"' + (x.v === sel ? ' selected' : '') + '>' + x.l + '</option>';
  }).join('');
}
function countType(v) {
  return S.clients.filter(function (c) { return clientType(c).v === v; }).length;
}

/* Un client sans statut explicite est considere actif (donnees anciennes) */
function isActive(c) { return (c.status || 'actif') === 'actif'; }
function activeClients() { return S.clients.filter(isActive); }

/* Nombre de mois ecoules depuis une date. 2629800000 ms = 1 mois moyen. */
function monthsSince(d) {
  if (!d) return 0;
  const dt = new Date(d.length === 10 ? d + 'T12:00:00' : d);
  if (isNaN(dt)) return 0;
  return Math.max(0, Math.floor((Date.now() - dt.getTime()) / 2629800000));
}

function clientAge(c) { return monthsSince(c.since || c.createdAt); }
function isLoyal(c)   { return isActive(c) && clientAge(c) >= LOYAL_MO; }

/* Etoiles de fidelite : 3 mois, 6 mois, 1 an */
function loyaltyStars(c) {
  if (!isActive(c)) return '';
  const m = clientAge(c);
  return m >= 12 ? '★★★' : m >= 6 ? '★★' : m >= LOYAL_MO ? '★' : '';
}

function ageLabel(m) {
  if (m < 1) return '< 1 mois';
  if (m < 12) return m + ' mois';
  const y = Math.floor(m / 12), r = m % 12;
  return y + ' an' + (y > 1 ? 's' : '') + (r ? ' ' + r + ' m' : '');
}

/* Demande hebdomadaire engagee par les clients actifs */
function weeklyDemand() {
  return activeClients().reduce(function (s, c) { return s + (c.weeklyTrays || 0); }, 0);
}

/* Poids de chaque type de client dans la demande hebdomadaire.

   Le volume de tete ne compte que les clients actifs — c'est la demande
   reelle, celle qui doit etre couverte par le stock. Le volume des
   inactifs est renvoye a part : ce n'est pas de la demande d'aujourd'hui,
   mais c'est ce qu'on recupererait en les faisant revenir. */
function demandByType() {
  return TYPES.map(function (t) {
    const all = S.clients.filter(function (c) { return clientType(c).v === t.v; });
    return {
      type: t,
      clients: all.length,
      active: all.filter(isActive).length,
      trays: all.filter(isActive)
                .reduce(function (s, c) { return s + (c.weeklyTrays || 0); }, 0),
      dormant: all.filter(function (c) { return !isActive(c); })
                  .reduce(function (s, c) { return s + (c.weeklyTrays || 0); }, 0)
    };
  });
}

/* Volume « dormant » : ce que representaient les clients devenus inactifs */
function dormantDemand() {
  return S.clients
    .filter(function (c) { return !isActive(c); })
    .reduce(function (s, c) { return s + (c.weeklyTrays || 0); }, 0);
}

function dailyDemand() { return weeklyDemand() / 7; }

/* Recherche par nom ou telephone, parmi les clients actifs seulement */
function clientMatches(q) {
  q = (q || '').trim().toLowerCase();
  return activeClients()
    .filter(function (c) {
      if (!q) return true;
      return c.name.toLowerCase().includes(q)
          || c.phone.replace(/\s/g, '').includes(q.replace(/\s/g, ''));
    })
    .sort(function (a, b) { return a.name.localeCompare(b.name, 'fr'); });
}

function clientOpts(q) {
  return clientMatches(q).map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.name) + ' — ' + clientType(c).s
         + (c.phone ? ' — ' + esc(c.phone) : '') + '</option>';
  }).join('');
}

/* ===== js/helpers/debts.js ===== */
/* =====================================================================
   HELPERS DETTES — reste a payer, statut, montant deja regle
   Une dette n'est jamais modifiee « en place » : son montant reste celui
   d'origine et les reglements s'empilent dans payments[]. L'historique
   est donc toujours reconstituable.
   ===================================================================== */

function debtPaid(d) {
  return (d.payments || []).reduce(function (s, p) { return s + p.amount; }, 0);
}

function debtRemaining(d) {
  return d.amount - debtPaid(d);
}

function debtStatus(d) {
  return debtRemaining(d) <= 0 ? 'soldee' : 'en_cours';
}

/* Total encore du, toutes dettes confondues. Un trop-percu sur une dette
   ne vient pas diminuer le total des autres : on plancher a zero. */
function totalOwed() {
  return S.debts.reduce(function (s, d) {
    const r = debtRemaining(d);
    return s + (r > 0 ? r : 0);
  }, 0);
}

function countDebts(status) {
  return S.debts.filter(function (d) { return debtStatus(d) === status; }).length;
}

function clientName(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  return c ? c.name : 'Client inconnu';
}

/* ===== js/pages/dashboard.js ===== */
/* =====================================================================
   PAGE — TABLEAU DE BORD

   Hierarchie de lecture, du plus important au plus detaille :
     1. l'argent du mois (chiffre d'affaires, marge, depenses, dettes)
     2. le stock et sa couverture — la question operationnelle du jour
     3. la tendance des sept derniers jours
     4. le detail clients et dettes
   Les memes sept indicateurs qu'avant sont presents ; c'est leur poids
   visuel qui differe, pour qu'un coup d'oeil suffise.
   ===================================================================== */
function rDash() {
  const pg = document.getElementById('pg-dashboard');

  /* Tant que la premiere lecture du cloud n'a rien rendu et que rien
     n'est en cache, on montre un squelette plutot qu'un ecran vide. */
  if (cloudLoading && !hasData()) { pg.innerHTML = skeletonPage(); return; }

  const mo = selMonth;
  const moSales = S.sales.filter(function (s) { return s.date.startsWith(mo); });
  const moExp   = S.expenses.filter(function (e) { return e.date.startsWith(mo); });

  const totalRev    = moSales.reduce(function (s, x) { return s + x.quantity * x.sellingPrice; }, 0);
  const totalCost   = moSales.reduce(function (s, x) { return s + x.quantity * x.costPrice; }, 0);
  const totalMargin = totalRev - totalCost;
  const totalExp    = moExp.reduce(function (s, x) { return s + x.amount; }, 0);
  const totalNet    = totalMargin - totalExp;
  const totalDebt   = totalOwed();
  const rate        = totalRev ? (totalMargin / totalRev) * 100 : 0;

  const moSold = moSales.reduce(function (s, x) { return s + x.quantity; }, 0);

  /* Sept derniers jours glissants, aujourd'hui inclus */
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    days.push({
      label: d.toLocaleDateString('fr-FR', { weekday: 'short' }),
      value: getSold(ds),
      now: i === 0
    });
  }

  const stock = getCurrentStock();
  const dDem  = dailyDemand();
  const cover = dDem > 0 ? stock / dDem : null;
  const tone  = coverTone(cover);
  const lastRec = lastReception();

  const nAct = activeClients().length;
  const nLoy = S.clients.filter(isLoyal).length;
  const enCours = countDebts('en_cours');
  const soldees = countDebts('soldee');

  pg.innerHTML = `
    <div class="pg-hd">
      <h1>Tableau de bord</h1>
      <span class="pg-sub">${moLabel(mo)}</span>
    </div>

    <div class="hero">
      <div class="panel">
        <div class="hero-hd">
          <span class="eyebrow">Chiffre d'affaires du mois</span>
          ${totalRev ? `<span class="badge ${totalMargin >= 0 ? 'badge-green' : 'badge-red'}">${rate.toFixed(0)} % de marge</span>` : ''}
        </div>
        <div class="hero-v" data-count="${totalRev}" data-fmt="cfa">${cfa(totalRev)}</div>
        <div class="hero-u">${num(moSold)} ${plur(moSold, 'plateau', 'x')} ${plur(moSold, 'vendu')} ce mois</div>
        <div class="hero-split">
          ${mini({ tone: totalMargin >= 0 ? 'up' : 'down', value: cfa(totalMargin), count: totalMargin, fmt: 'cfa', label: 'Marge brute' })}
          ${mini({ value: cfa(totalExp), count: totalExp, fmt: 'cfa', label: 'Dépenses du mois' })}
          ${mini({ tone: totalNet >= 0 ? 'up' : 'down', value: cfa(totalNet), count: totalNet, fmt: 'cfa', label: 'Marge nette' })}
          ${mini({ tone: totalDebt > 0 ? 'down' : '', value: cfa(totalDebt), count: totalDebt, fmt: 'cfa', label: 'Dettes en cours' })}
        </div>
      </div>

      <div class="panel">
        <div class="hero-hd">
          <span class="eyebrow">Stock</span>
          ${cover != null ? `<span class="badge badge-${tone === 'gold' ? 'gold' : tone === 'red' ? 'red' : 'green'}">${
            tone === 'red' ? 'Tension' : tone === 'gold' ? 'À surveiller' : 'Confortable'}</span>` : ''}
        </div>
        <div class="hero-v" data-count="${stock}">${num(stock)}</div>
        <div class="hero-u">plateaux en magasin</div>
        ${cover != null ? gauge({
          label: 'Couverture des besoins',
          value: cover.toFixed(1) + ' jours',
          now: cover, max: 14,
          tone: tone === 'gold' ? 'gold' : tone === 'red' ? 'red' : '',
          scale: ['0', `${COVER_MID} j`, '14 j +']
        }) : `<div class="form-hint" style="margin-top:20px">Renseignez les plateaux/semaine de vos clients pour suivre la couverture du stock.</div>`}
        <div class="hero-foot">${lastRec
          ? `Dernière réception : <strong>${lastRec.quantity} plateaux</strong> ${agoLabel(lastRec.date)}`
          : 'Aucune réception enregistrée'}</div>
      </div>
    </div>

    <div class="card">
      <h3>${icon('chart')} Ventes des 7 derniers jours</h3>
      ${barChart(days)}
    </div>

    <div class="duo">
      <div class="card">
        <h3>${icon('users')} Clients</h3>
        <div class="big-n">${nAct}<small> / ${S.clients.length} actifs</small></div>
        <div class="big-sub">${nLoy} ${plur(nLoy, 'fidèle')} ★ · ${S.clients.length - nAct} ${plur(S.clients.length - nAct, 'inactif')} · ${weeklyDemand()} plateaux/sem.</div>
        ${S.clients.length ? prog(nAct, S.clients.length, 'gold') : ''}
      </div>
      <div class="card">
        <h3>${icon('wallet')} Dettes</h3>
        <div class="big-n">${enCours}<small> / ${S.debts.length} en cours</small></div>
        <div class="big-sub">${soldees} ${plur(soldees, 'soldée')} · <strong>${cfa(totalDebt)}</strong> à recouvrer</div>
        ${S.debts.length ? prog(soldees, S.debts.length) : ''}
      </div>
    </div>`;
}

/* ===== js/pages/clients.js ===== */
/* =====================================================================
   PAGE — CLIENTS
   Fichier client complet : creation, modification, passage en inactif
   avec motif, reactivation, suppression.
   ===================================================================== */
function rClients() {
  let list = S.clients;

  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(function (c) {
      return c.name.toLowerCase().includes(q) || c.phone.includes(searchQ);
    });
  }
  if (filterType !== 'all') list = list.filter(function (c) { return c.type === filterType; });
  if (filterStat === 'actif')        list = list.filter(isActive);
  else if (filterStat === 'inactif') list = list.filter(function (c) { return !isActive(c); });
  else if (filterStat === 'fidele')  list = list.filter(isLoyal);

  /* Actifs d'abord, puis les plus anciens : les clients qui comptent
     remontent naturellement en haut du tableau. */
  list = [...list].sort(function (a, b) {
    return (isActive(b) - isActive(a)) || (clientAge(b) - clientAge(a));
  });

  const nAct   = activeClients().length;
  const nInact = S.clients.length - nAct;
  const nFid   = S.clients.filter(isLoyal).length;
  const dorm   = dormantDemand();

  document.getElementById('pg-clients').innerHTML = `
    <div class="pg-hd">
      <h1>Clients</h1>
      <button class="btn btn-p" onclick="addClient()">${icon('plus')} Nouveau client</button>
    </div>

    <div class="stats">
      ${st({ tone: 'gold',  icon: 'users',     value: num(S.clients.length), count: S.clients.length, label: 'Total clients' })}
      ${st({ tone: 'green', icon: 'userCheck', value: num(nAct), count: nAct, label: 'Actifs' })}
      ${st({ tone: 'red',   icon: 'userOff',   value: num(nInact), count: nInact,
             label: 'Inactifs' + (dorm > 0 ? ` · ${dorm} pl./sem. perdus` : '') })}
      ${st({ tone: 'gold',  icon: 'star',      value: nFid + ' ★', count: nFid, suffix: ' ★',
             label: `Fidèles (${LOYAL_MO} mois et +)` })}
      ${st({ tone: 'blue',  icon: 'box',       value: num(weeklyDemand()), count: weeklyDemand(),
             label: 'Plateaux / semaine (actifs)' })}
    </div>

    <div class="pills">
      <button class="pill ${filterStat === 'all' ? 'active' : ''}" onclick="filterStat='all';rClients()">Tous</button>
      <button class="pill ${filterStat === 'actif' ? 'active' : ''}" onclick="filterStat='actif';rClients()">Actifs (${nAct})</button>
      <button class="pill ${filterStat === 'inactif' ? 'active' : ''}" onclick="filterStat='inactif';rClients()">Inactifs (${nInact})</button>
      <button class="pill ${filterStat === 'fidele' ? 'active' : ''}" onclick="filterStat='fidele';rClients()">★ Fidèles (${nFid})</button>
    </div>

    <div class="pills">
      <button class="pill ${filterType === 'all' ? 'active' : ''}" onclick="filterType='all';rClients()">Tous types</button>
      ${TYPES.map(function (t) {
        return `<button class="pill ${filterType === t.v ? 'active' : ''}" onclick="filterType='${t.v}';rClients()">${t.p} (${countType(t.v)})</button>`;
      }).join('')}
    </div>

    ${searchBar('Rechercher un client...', searchQ, 'searchQ=this.value;rClients()')}

    ${list.length ? `<div class="card card-flat"><div class="tbl-wrap"><table>
      <thead><tr><th>Nom</th><th>Téléphone</th><th>Statut</th><th>Type</th><th>Plateaux/sem.</th><th>Ancienneté</th><th></th></tr></thead>
      <tbody>${list.map(clientRow).join('')}</tbody>
    </table></div></div>` : emptyClients()}

    ${S.clients.length ? typeBreakdown() : ''}`;
}

/* Ce que chaque categorie de client pese dans la demande.

   Place en bas de page : on parcourt d'abord la liste, puis on lit ce
   qu'elle represente. La categorie choisie dans les filtres du haut est
   surlignee ici — la selectionner repond directement a « combien de
   plateaux prend-elle ? » — mais les trois lignes restent affichees, pour
   que le chiffre garde son point de comparaison.

   Les totaux portent sur tout le fichier client, pas sur la liste filtree
   au-dessus : une repartition qui changerait a chaque recherche ne serait
   plus une repartition. */
function typeBreakdown() {
  const rows  = demandByType();
  const total = rows.reduce(function (s, r) { return s + r.trays; }, 0);
  const dorm  = rows.reduce(function (s, r) { return s + r.dormant; }, 0);

  return `<div class="card">
    <h3>${icon('box')} Plateaux par semaine, par type de client</h3>
    <div class="card-sub">Demande engagée par les clients actifs. Cliquez un type ci-dessus pour le retrouver surligné.</div>

    ${rows.map(function (r) {
      const share = total ? (r.trays / total) * 100 : 0;
      const sel = filterType === r.type.v;
      /* « 3 clients » quand ils sont tous actifs, « 2 actifs sur 3 » sinon :
         la mention ne s'allonge que lorsqu'elle apprend quelque chose. */
      const who = r.active === r.clients
        ? `${r.clients} ${plur(r.clients, 'client')}`
        : `${r.active} ${plur(r.active, 'actif')} sur ${r.clients}`;
      return `<div class="type-row ${sel ? 'is-sel' : ''}">
        <div class="t-name">
          <span class="badge ${r.type.b}">${r.type.p}</span>
          <span class="muted">${who}</span>
        </div>
        <div class="prog"><div class="prog-fill ${r.type.b.replace('badge-', '')}" style="width:${share.toFixed(1)}%"></div></div>
        <div class="t-amt">
          ${num(r.trays)} pl./sem.
          <span class="muted">${share.toFixed(0)} %${r.dormant > 0 ? ` · +${r.dormant} dormants` : ''}</span>
        </div>
      </div>`;
    }).join('')}

    <div class="type-total">
      <span>Total des clients actifs</span>
      <span>${num(total)} plateaux / semaine${total ? ` <span class="muted" style="font-weight:400">· ≈ ${num(Math.round(total * 52 / 12))} / mois</span>` : ''}</span>
    </div>
    ${dorm > 0 ? `<div class="form-hint">${num(dorm)} plateaux/semaine sont portés par des clients inactifs — volume récupérable s'ils reviennent.</div>` : ''}
  </div>`;
}

/* Une ligne du tableau des clients */
function clientRow(c) {
  const act = isActive(c);
  return `<tr class="${act ? '' : 'row-off'}">
    <td>
      <strong class="nowrap">${esc(c.name)}</strong> <span class="stars">${loyaltyStars(c)}</span>
      ${c.address ? `<span class="cell-sub">${esc(c.address)}</span>` : ''}
    </td>
    <td class="nowrap">${esc(c.phone)}</td>
    <td>
      <span class="badge ${act ? 'badge-green' : 'badge-gray'}">${act ? 'Actif' : 'Inactif'}</span>
      ${!act && c.inactiveReason ? `<span class="cell-sub">${esc(c.inactiveReason)}</span>` : ''}
    </td>
    <td>${typeBadge(c)}</td>
    <td><strong>${c.weeklyTrays || 0}</strong></td>
    <td class="nowrap" style="color:var(--tx2)">
      ${ageLabel(clientAge(c))}
      ${!act && c.statusSince ? `<span class="cell-sub">parti le ${fmtD(c.statusSince)}</span>` : ''}
    </td>
    <td class="nowrap">
      <button class="btn-icon ${act ? '' : 'ok'}" onclick="toggleStatus('${c.id}')" title="${act ? 'Marquer inactif' : 'Réactiver'}">${act ? '&#9210;' : '&#10004;'}</button>
      <button class="btn-icon edit" onclick="editClient('${c.id}')" title="Modifier">&#9998;</button>
      <button class="btn-icon" onclick="delClient('${c.id}')" title="Supprimer">&times;</button>
    </td>
  </tr>`;
}

/* Etat vide : distingue « aucun client » de « aucun resultat de filtre » */
function emptyClients() {
  const filtered = searchQ || filterType !== 'all' || filterStat !== 'all';
  if (filtered) {
    return emptyState({
      icon: 'search',
      title: 'Aucun résultat',
      text: 'Aucun client ne correspond à cette recherche ou à ces filtres.',
      action: `<button class="btn btn-s" onclick="searchQ='';filterType='all';filterStat='all';rClients()">Réinitialiser les filtres</button>`
    });
  }
  return emptyState({
    icon: 'users',
    title: 'Aucun client enregistré',
    text: 'Ajoutez vos clients pour suivre leur demande hebdomadaire, leur fidélité et leurs dettes.',
    action: `<button class="btn btn-p" onclick="addClient()">${icon('plus')} Nouveau client</button>`
  });
}

/* --- Formulaires --- */

function clientForm(c) {
  const isNew = !c;
  return `
    <div class="form-g"><label>Nom complet *</label><input id="m-name" value="${isNew ? '' : esc(c.name)}"></div>
    <div class="form-g"><label>Téléphone *</label><input id="m-phone" type="tel" value="${isNew ? '' : esc(c.phone)}"></div>
    <div class="form-row">
      <div class="form-g"><label>Type de client</label><select id="m-type">${typeOpts(isNew ? 'final' : clientType(c).v)}</select></div>
      <div class="form-g"><label>Statut</label><select id="m-status">
        <option value="actif" ${isNew || isActive(c) ? 'selected' : ''}>Actif</option>
        <option value="inactif" ${!isNew && !isActive(c) ? 'selected' : ''}>Inactif</option>
      </select></div>
    </div>
    <div class="form-row">
      <div class="form-g"><label>Plateaux par semaine</label><input id="m-week" type="number" min="0" step="1" value="${isNew ? 0 : (c.weeklyTrays || 0)}"></div>
      <div class="form-g"><label>Client depuis</label><input id="m-since" type="date" value="${isNew ? today() : esc(c.since || (c.createdAt || '').substring(0, 10))}"></div>
    </div>
    <div class="form-hint">${isNew
      ? "Plateaux/semaine : quantité habituelle, sert à estimer la demande et la couverture du stock. Client depuis : sert à calculer l'ancienneté et la fidélité."
      : `Ancienneté actuelle : <strong>${ageLabel(clientAge(c))}</strong>${isLoyal(c) ? ' — client fidèle &#9733;' : ''}${!isActive(c) && c.inactiveReason ? ` &middot; Inactif : ${esc(c.inactiveReason)}` : ''}`}</div>
    <div class="form-g"><label>Adresse</label><input id="m-addr" value="${isNew ? '' : esc(c.address || '')}"></div>
    <div class="form-g"><label>Notes</label><textarea id="m-notes" rows="2">${isNew ? '' : esc(c.notes || '')}</textarea></div>`;
}

function addClient() {
  openModal('Nouveau client', clientForm(null) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveClient()">Enregistrer</button>
    </div>`);
}

function editClient(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  openModal('Modifier le client', clientForm(c) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="updClient('${id}')">Enregistrer</button>
    </div>`);
}

/* Lit et valide le formulaire. Renvoie null si la saisie est invalide,
   apres avoir affiche le message d'erreur. */
function readClientForm() {
  const name  = val('m-name');
  const phone = val('m-phone');
  if (!name || !phone) { toast('Nom et téléphone requis', 'err'); return null; }

  const raw = document.getElementById('m-week').value;
  const w = parseInt(raw, 10);
  if (raw !== '' && (isNaN(w) || w < 0)) { toast('Nombre de plateaux invalide', 'err'); return null; }

  return {
    name: name,
    phone: phone,
    type: val('m-type'),
    status: val('m-status'),
    since: val('m-since'),
    weeklyTrays: isNaN(w) ? 0 : w,
    address: val('m-addr'),
    notes: val('m-notes')
  };
}

function saveClient() {
  const f = readClientForm();
  if (!f) return;
  f.since = f.since || today();
  S.clients.push(Object.assign({
    id: gid(),
    statusSince: today(),
    inactiveReason: '',
    createdAt: new Date().toISOString()
  }, f));
  save(); closeModal(); rClients(); toast('Client ajouté');
}

function updClient(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  const f = readClientForm();
  if (!f) return;

  /* Un changement de statut redate le passage actif / inactif */
  if (f.status !== (c.status || 'actif')) {
    c.statusSince = today();
    if (f.status === 'actif') c.inactiveReason = '';
  }
  /* Un champ date vide ne doit pas effacer l'anciennete deja connue */
  f.since = f.since || c.since;
  Object.assign(c, f);
  save(); closeModal(); rClients(); toast('Client modifié');
}

function toggleStatus(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  isActive(c) ? askInactive(id) : reactivate(id);
}

function askInactive(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  openModal('Marquer comme inactif', `
    <p style="margin-bottom:14px"><strong>${esc(c.name)}</strong> n'achète plus pour le moment. Il reste dans la liste mais sort de la demande hebdomadaire et perd son ancienneté de fidélité.</p>
    <div class="form-row">
      <div class="form-g"><label>Inactif depuis</label><input id="m-sdate" type="date" value="${today()}"></div>
      <div class="form-g"><label>Raison</label><select id="m-reason">
        <option>Hausse des prix</option><option>Parti chez un concurrent</option>
        <option>Arr&ecirc;t d'activit&eacute;</option><option>D&eacute;m&eacute;nagement</option>
        <option>Impay&eacute;</option><option>Autre</option>
      </select></div>
    </div>
    <div class="form-g"><label>Précision</label><input id="m-rnote" placeholder="Optionnel"></div>
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveInactive('${id}')">Confirmer</button>
    </div>`);
}

function saveInactive(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  const r = val('m-reason'), note = val('m-rnote');
  c.status = 'inactif';
  c.statusSince = val('m-sdate') || today();
  c.inactiveReason = note ? r + ' — ' + note : r;
  save(); closeModal(); rClients(); toast(c.name + ' marqué inactif');
}

async function reactivate(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  if (await showConfirm('Réactiver ' + esc(c.name) + ' ? Son ancienneté de fidélité repart à zéro.', false)) {
    c.status = 'actif';
    c.statusSince = today();
    c.since = today();
    c.inactiveReason = '';
    save(); rClients(); toast(c.name + ' réactivé');
  }
}

async function delClient(id) {
  const c = S.clients.find(function (x) { return x.id === id; });
  if (!c) return;
  if (await showConfirm('Supprimer <strong>' + esc(c.name) + '</strong> ? Cette action est irréversible.')) {
    S.clients = S.clients.filter(function (x) { return x.id !== id; });
    save(); rClients(); toast('Client supprimé');
  }
}

/* ===== js/pages/debts.js ===== */
/* =====================================================================
   PAGE — DETTES
   Chaque dette garde son montant d'origine ; les reglements s'ajoutent
   dans payments[]. La barre de progression montre la part deja reglee.
   ===================================================================== */
function rDebts() {
  let list = [...S.debts];
  if (filterDebt === 'en_cours')    list = list.filter(function (d) { return debtStatus(d) === 'en_cours'; });
  else if (filterDebt === 'soldee') list = list.filter(function (d) { return debtStatus(d) === 'soldee'; });
  list.sort(function (a, b) { return b.date.localeCompare(a.date); });

  const enCours = countDebts('en_cours');
  const soldees = countDebts('soldee');

  document.getElementById('pg-debts').innerHTML = `
    <div class="pg-hd">
      <h1>Dettes</h1>
      <button class="btn btn-p" onclick="addDebt()">${icon('plus')} Nouvelle dette</button>
    </div>

    <div class="stats">
      ${st({ tone: 'red',   icon: 'alert',       value: cfa(totalOwed()), count: totalOwed(), fmt: 'cfa', label: 'Total dettes en cours' })}
      ${st({ tone: 'gold',  icon: 'clock',       value: num(enCours), count: enCours, label: 'Dettes actives' })}
      ${st({ tone: 'green', icon: 'checkCircle', value: num(soldees), count: soldees, label: 'Dettes soldées' })}
    </div>

    <div class="pills">
      <button class="pill ${filterDebt === 'all' ? 'active' : ''}" onclick="filterDebt='all';rDebts()">Toutes (${S.debts.length})</button>
      <button class="pill ${filterDebt === 'en_cours' ? 'active' : ''}" onclick="filterDebt='en_cours';rDebts()">En cours (${enCours})</button>
      <button class="pill ${filterDebt === 'soldee' ? 'active' : ''}" onclick="filterDebt='soldee';rDebts()">Soldées (${soldees})</button>
    </div>

    ${list.length ? `<div class="debt-list">${list.map(debtCard).join('')}</div>` : emptyDebts()}`;
}

/* Carte d'une dette : entete, progression, historique des paiements */
function debtCard(d) {
  const rem    = debtRemaining(d);
  const paid   = debtPaid(d);
  const status = debtStatus(d);
  const pays   = d.payments || [];
  const c      = S.clients.find(function (x) { return x.id === d.clientId; });

  return `<div class="card">
    <div class="debt-hd">
      <div>
        <span class="debt-name">${esc(clientName(d.clientId))}</span>
        ${c && !isActive(c) ? ' <span class="badge badge-gray">Inactif</span>' : ''}
        <div class="debt-meta">${d.description ? esc(d.description) + ' — ' : ''}${fmtD(d.date)}</div>
      </div>
      <div class="debt-amt">
        <span class="badge ${status === 'en_cours' ? 'badge-red' : 'badge-green'}">${status === 'en_cours' ? 'En cours' : 'Soldée'}</span>
        <div class="rem">${cfa(rem > 0 ? rem : 0)}</div>
        <div class="tot">sur ${cfa(d.amount)}</div>
      </div>
    </div>

    <div class="debt-prog">
      <div class="prog-lbl"><span>${cfa(paid)} réglés</span><span>${pct(paid, d.amount).toFixed(0)} %</span></div>
      ${prog(paid, d.amount)}
    </div>

    ${pays.length ? `<div class="pay-list">${pays.map(function (p) {
      return `<div class="pay-row">
        <span class="pay-amt">+${cfa(p.amount)}</span>
        <span class="pay-date">${fmtD(p.date)}${p.note ? ' — ' + esc(p.note) : ''}</span>
      </div>`;
    }).join('')}</div>` : ''}

    <div class="debt-actions">
      ${status === 'en_cours' ? `<button class="btn btn-s btn-sm" onclick="addPayment('${d.id}')">${icon('plus')} Paiement</button>` : ''}
      <button class="btn-icon" onclick="delDebt('${d.id}')" title="Supprimer">&times;</button>
    </div>
  </div>`;
}

function emptyDebts() {
  if (filterDebt !== 'all') {
    return emptyState({
      icon: 'wallet', small: true,
      title: filterDebt === 'en_cours' ? 'Aucune dette en cours' : 'Aucune dette soldée',
      text: filterDebt === 'en_cours' ? 'Tout est réglé — rien à recouvrer pour le moment.' : 'Aucune dette n\'a encore été soldée.',
      action: `<button class="btn btn-s" onclick="filterDebt='all';rDebts()">Voir toutes les dettes</button>`
    });
  }
  return emptyState({
    icon: 'wallet',
    title: 'Aucune dette enregistrée',
    text: 'Enregistrez une dette pour suivre les montants dus et les paiements partiels de vos clients.',
    action: `<button class="btn btn-p" onclick="addDebt()">${icon('plus')} Nouvelle dette</button>`
  });
}

/* --- Selection du client dans le formulaire --- */

/* Filtre la liste deroulante pendant la frappe et resume ce qui est
   propose : seuls les clients actifs peuvent recevoir une nouvelle dette. */
function filterClientSel() {
  const q    = document.getElementById('m-csearch').value;
  const sel  = document.getElementById('m-client');
  const prev = sel.value;

  sel.innerHTML = clientOpts(q);
  if (prev && [...sel.options].some(function (o) { return o.value === prev; })) sel.value = prev;

  const n = sel.options.length;
  const trimmed = q.trim().toLowerCase();
  const hidden = trimmed
    ? S.clients.filter(function (c) { return !isActive(c) && c.name.toLowerCase().includes(trimmed); }).length
    : 0;

  document.getElementById('m-cinfo').textContent = n
    ? `${n} ${plur(n, 'client')} ${plur(n, 'actif', 's')}`
      + (hidden ? ` · ${hidden} ${plur(hidden, 'inactif')} ${plur(hidden, 'masqué')}` : '')
    : (hidden
        ? `Aucun client actif — ${hidden} ${plur(hidden, 'client')} ${plur(hidden, 'inactif')} ${hidden > 1 ? 'correspondent' : 'correspond'} : réactivez-le depuis la page Clients.`
        : 'Aucun client ne correspond à cette recherche.');
}

function addDebt() {
  const act = activeClients().length;
  if (!act) {
    toast(S.clients.length ? "Aucun client actif — réactivez un client d'abord" : "Ajoutez d'abord un client", 'err');
    return;
  }
  openModal('Nouvelle dette', `
    <div class="form-g"><label>Client *</label>
      <input id="m-csearch" placeholder="Rechercher par nom ou téléphone..." oninput="filterClientSel()" autocomplete="off">
      <select id="m-client" style="margin-top:6px">${clientOpts('')}</select>
      <div class="form-hint" id="m-cinfo">${act} ${plur(act, 'client')} ${plur(act, 'actif', 's')} · les inactifs ne sont pas proposés</div>
    </div>
    <div class="form-g"><label>Montant (FCFA) *</label><input id="m-amount" type="number" min="0"></div>
    <div class="form-g"><label>Description</label><input id="m-desc" placeholder="Ex: Achat 20 plateaux"></div>
    <div class="form-g"><label>Date</label><input id="m-date" type="date" value="${today()}"></div>
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveDebt()">Enregistrer</button>
    </div>`);
}

function saveDebt() {
  const cid = val('m-client');
  if (!cid) { toast('Sélectionnez un client', 'err'); return; }
  const amt = numVal('m-amount');
  if (!amt || amt <= 0) { toast('Montant invalide', 'err'); return; }

  S.debts.push({
    id: gid(),
    clientId: cid,
    amount: amt,
    description: val('m-desc'),
    date: val('m-date') || today(),
    payments: []
  });
  save(); closeModal(); rDebts(); toast('Dette ajoutée');
}

function addPayment(debtId) {
  const d = S.debts.find(function (x) { return x.id === debtId; });
  if (!d) return;
  const rem = debtRemaining(d);

  openModal('Ajouter un paiement', `
    <p style="margin-bottom:8px">Reste à payer : <strong>${cfa(rem)}</strong></p>
    <div class="prog-lbl"><span>${cfa(debtPaid(d))} déjà réglés</span><span>sur ${cfa(d.amount)}</span></div>
    ${prog(debtPaid(d), d.amount)}
    <div class="form-g" style="margin-top:16px"><label>Montant du paiement (FCFA) *</label><input id="m-payamt" type="number" min="0" max="${rem}" value="${rem}"></div>
    <div class="form-g"><label>Date</label><input id="m-paydate" type="date" value="${today()}"></div>
    <div class="form-g"><label>Note</label><input id="m-paynote" placeholder="Ex: Acompte"></div>
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="savePayment('${debtId}')">Enregistrer</button>
    </div>`);
}

function savePayment(debtId) {
  const d = S.debts.find(function (x) { return x.id === debtId; });
  if (!d) return;
  const amt = numVal('m-payamt');
  if (!amt || amt <= 0) { toast('Montant invalide', 'err'); return; }

  if (!d.payments) d.payments = [];
  d.payments.push({
    id: gid(),
    amount: amt,
    date: val('m-paydate') || today(),
    note: val('m-paynote')
  });
  save(); closeModal(); rDebts();
  toast(debtStatus(d) === 'soldee' ? 'Dette soldée !' : 'Paiement enregistré');
}

async function delDebt(id) {
  const d = S.debts.find(function (x) { return x.id === id; });
  if (!d) return;
  if (await showConfirm('Supprimer la dette de <strong>' + esc(clientName(d.clientId)) + '</strong> et son historique de paiements ?')) {
    S.debts = S.debts.filter(function (x) { return x.id !== id; });
    save(); rDebts(); toast('Dette supprimée');
  }
}

/* ===== js/pages/expenses.js ===== */
/* =====================================================================
   PAGE — DEPENSES
   Saisie par categorie, navigation mois par mois, repartition visuelle.
   ===================================================================== */
function rExpenses() {
  const mo = selMonth;
  const list = S.expenses
    .filter(function (e) { return e.date.startsWith(mo); })
    .sort(function (a, b) { return b.date.localeCompare(a.date); });

  const total = list.reduce(function (s, e) { return s + e.amount; }, 0);

  const byCat = {};
  list.forEach(function (e) { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const topCat = Object.entries(byCat).sort(function (a, b) { return b[1] - a[1]; });

  document.getElementById('pg-expenses').innerHTML = `
    <div class="pg-hd">
      <h1>Dépenses</h1>
      <button class="btn btn-p" onclick="addExpense()">${icon('plus')} Nouvelle dépense</button>
    </div>

    ${moNav()}

    <div class="stats">
      ${st({ tone: 'red',  icon: 'receipt', value: cfa(total), count: total, fmt: 'cfa', label: 'Total dépenses' })}
      ${st({ tone: 'gold', icon: 'list',    value: num(list.length), count: list.length, label: "Nombre d'entrées" })}
      ${st({ tone: 'blue', icon: 'tag',     value: topCat.length ? esc(topCat[0][0]) : '—', label: 'Catégorie principale' })}
    </div>

    ${topCat.length ? `<div class="card">
      <h3>Répartition par catégorie</h3>
      ${topCat.map(function (entry) {
        const cat = entry[0], amt = entry[1];
        return `<div class="cat-row">
          <span class="cat-name">${esc(cat)}</span>
          ${prog(amt, total, 'gold')}
          <span class="cat-amt">${cfa(amt)}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${list.length ? `<div class="card card-flat"><div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Description</th><th>Catégorie</th><th class="ta-r">Montant</th><th></th></tr></thead>
      <tbody>${list.map(function (e) {
        return `<tr>
          <td class="nowrap">${fmtD(e.date)}</td>
          <td>${esc(e.description)}</td>
          <td><span class="badge badge-gold">${esc(e.category)}</span></td>
          <td class="ta-r" style="font-weight:600">${cfa(e.amount)}</td>
          <td class="nowrap">
            <button class="btn-icon edit" onclick="editExpense('${e.id}')" title="Modifier">&#9998;</button>
            <button class="btn-icon" onclick="delExpense('${e.id}')" title="Supprimer">&times;</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div></div>` : emptyState({
      icon: 'receipt',
      title: 'Aucune dépense ce mois',
      text: `Rien n'a encore été enregistré pour ${moLabel(mo)}.`,
      action: `<button class="btn btn-p" onclick="addExpense()">${icon('plus')} Nouvelle dépense</button>`
    })}`;
}

/* Options de categorie. Une categorie disparue de CATS mais presente dans
   une ancienne depense reste proposee, pour ne pas la perdre en modifiant. */
function catOpts(sel) {
  const list = (sel && !CATS.includes(sel)) ? CATS.concat([sel]) : CATS;
  return list.map(function (c) {
    return '<option' + (c === sel ? ' selected' : '') + '>' + esc(c) + '</option>';
  }).join('');
}

function expenseForm(e) {
  return `
    <div class="form-g"><label>Description *</label><input id="m-desc" value="${e ? esc(e.description) : ''}"></div>
    <div class="form-row">
      <div class="form-g"><label>Montant (FCFA) *</label><input id="m-amount" type="number" min="0" value="${e ? e.amount : ''}"></div>
      <div class="form-g"><label>Catégorie</label><select id="m-cat">${catOpts(e ? e.category : null)}</select></div>
    </div>
    <div class="form-g"><label>Date</label><input id="m-date" type="date" value="${e ? e.date : today()}"></div>`;
}

function addExpense() {
  openModal('Nouvelle dépense', expenseForm(null) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveExpense()">Enregistrer</button>
    </div>`);
}

function saveExpense() {
  const desc = val('m-desc'), amt = numVal('m-amount');
  if (!desc || !amt || amt <= 0) { toast('Description et montant requis', 'err'); return; }
  S.expenses.push({
    id: gid(),
    description: desc,
    amount: amt,
    category: val('m-cat'),
    date: val('m-date') || today()
  });
  save(); closeModal(); rExpenses(); toast('Dépense ajoutée');
}

function editExpense(id) {
  const e = S.expenses.find(function (x) { return x.id === id; });
  if (!e) return;
  openModal('Modifier la dépense', expenseForm(e) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="updExpense('${id}')">Enregistrer</button>
    </div>`);
}

function updExpense(id) {
  const e = S.expenses.find(function (x) { return x.id === id; });
  if (!e) return;
  const desc = val('m-desc'), amt = numVal('m-amount');
  if (!desc || !amt) { toast('Champs requis', 'err'); return; }
  e.description = desc;
  e.amount = amt;
  e.category = val('m-cat');
  e.date = val('m-date');
  save(); closeModal(); rExpenses(); toast('Dépense modifiée');
}

async function delExpense(id) {
  if (await showConfirm('Supprimer cette dépense ?')) {
    S.expenses = S.expenses.filter(function (x) { return x.id !== id; });
    save(); rExpenses(); toast('Dépense supprimée');
  }
}

/* ===== js/pages/stock.js ===== */
/* =====================================================================
   PAGE — STOCK
   Trois blocs : la journee en cours, les besoins clients, puis le mois
   (receptions et journal quotidien).

   Regle de calcul : stock = point de depart + receptions - ventes (voir
   helpers/stock.js). Rien n'est saisi deux fois : une vente enregistree
   dans Marges fait baisser le stock ici, automatiquement. L'inventaire du
   soir ne sert qu'a recaler le compteur sur le comptage physique.
   ===================================================================== */
function rStock() {
  const t  = today();
  const mo = selMonth;

  const received = getReceived(t);
  const sold     = getSold(t);
  const inv      = inventoryOn(t);
  const gap      = stockGap(t);
  const curStock = getCurrentStock();
  const needsInit = needsInitialStock();

  const wDem  = weeklyDemand();
  const dDem  = dailyDemand();
  const cover = dDem > 0 ? curStock / dDem : null;
  const dorm  = dormantDemand();
  const lastRec = lastReception();

  const engaged = activeClients()
    .filter(function (c) { return (c.weeklyTrays || 0) > 0; })
    .sort(function (a, b) { return (b.weeklyTrays || 0) - (a.weeklyTrays || 0); });

  const moDates = activeDates(mo);
  const moRec = S.receptions.filter(function (r) { return r.date.startsWith(mo); })
    .sort(function (a, b) { return b.date.localeCompare(a.date); });

  const totalRec  = moRec.reduce(function (s, r) { return s + r.quantity; }, 0);
  const totalSold = S.sales.filter(function (s) { return s.date.startsWith(mo); })
    .reduce(function (s, x) { return s + x.quantity; }, 0);

  document.getElementById('pg-stock').innerHTML = `
    <div class="pg-hd"><h1>Stock</h1></div>

    ${needsInit ? `<div class="card" style="text-align:center;padding:32px">
      <h3>Configuration initiale</h3>
      <p style="color:var(--tx2);margin:8px 0 16px">Indiquez le stock dont vous disposez aujourd'hui : les réceptions et les ventes le feront ensuite varier tout seul.</p>
      <button class="btn btn-p" onclick="setInitStock()">Définir le stock de départ</button>
    </div>` : `<div class="today">
      <h3>${icon('calendar')} Aujourd'hui — ${fmtD(t)}</h3>
      <div class="today-grid">
        <div class="today-item"><span class="tl">Reçu aujourd'hui</span><span class="tv">${received}</span></div>
        <div class="today-item"><span class="tl">Vendu aujourd'hui</span><span class="tv">${sold}</span></div>
        <div class="today-item hl"><span class="tl">Stock en magasin</span><span class="tv">${num(curStock)}</span></div>
        ${inv ? `<div class="today-item"><span class="tl">Écart d'inventaire</span>
          <span class="tv" style="color:${gap === 0 ? 'var(--green)' : 'var(--red)'}">${gap > 0 ? '+' : ''}${gap}</span></div>`
              : `<div class="today-item"><span class="tl">Inventaire du soir</span><span class="tv" style="color:var(--tx3)">—</span></div>`}
      </div>
      <div class="today-actions">
        <button class="btn btn-p" onclick="addReception()">${icon('plus')} Réception</button>
        <button class="btn btn-s" onclick="addSale()">${icon('plus')} Vente du jour</button>
        ${inv
          ? '<button class="btn btn-s" onclick="doInventory()">Corriger l\'inventaire</button>'
          : '<button class="btn btn-s" onclick="doInventory()">Inventaire du soir</button>'}
      </div>
      ${curStock < 0 ? `<div class="form-hint" style="color:var(--red);margin-top:12px">
        Le stock calculé est négatif : il manque des réceptions, ou des ventes ont été saisies en double. Un inventaire du soir remet le compteur à la réalité du magasin.
      </div>` : ''}
    </div>`}

    ${wDem > 0 ? `<div class="card">
      <h3>Besoins clients</h3>
      <div class="stats" style="margin-bottom:14px">
        ${st({ tone: 'gold', icon: 'users', value: num(wDem), count: wDem, label: 'Plateaux / semaine engagés' })}
        ${st({ tone: 'blue', icon: 'chart', value: dDem.toFixed(1), count: dDem, fmt: 'dec', label: 'Besoin moyen / jour' })}
        ${st({ tone: coverTone(cover), icon: 'clock',
               value: cover == null ? '—' : cover.toFixed(1) + ' j',
               count: cover == null ? null : cover, fmt: 'dec', suffix: ' j',
               label: `Couverture du stock (${num(curStock)} plateaux)` })}
      </div>
      ${cover != null && cover < COVER_MID
        ? `<div class="form-hint" style="color:var(--red)">Stock insuffisant pour couvrir une semaine : il manque ${Math.max(0, Math.ceil(wDem - curStock))} plateaux.</div>`
        : ''}
      ${dorm > 0
        ? `<div class="form-hint">Hors calcul : ${dorm} plateaux/semaine chez des clients inactifs — volume récupérable s'ils reviennent.</div>`
        : ''}
      <div class="tbl-wrap" style="margin-top:12px"><table>
        <thead><tr><th>Client</th><th>Type</th><th>Plateaux/sem.</th><th>Part</th></tr></thead>
        <tbody>${engaged.map(function (c) {
          return `<tr>
            <td><strong class="nowrap">${esc(c.name)}</strong> <span class="stars">${loyaltyStars(c)}</span></td>
            <td>${typeBadge(c)}</td>
            <td>${c.weeklyTrays}</td>
            <td style="color:var(--tx2)">${(c.weeklyTrays / wDem * 100).toFixed(0)} %</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>` : ''}

    ${moNav()}

    <div class="stats">
      ${st({ tone: 'gold',  icon: 'truck', value: num(totalRec), count: totalRec, label: 'Plateaux reçus' })}
      ${st({ tone: 'green', icon: 'trend', value: num(totalSold), count: totalSold, label: 'Plateaux vendus' })}
      ${st({ tone: 'blue',  icon: 'coins', value: cfa(getLatestCost()), count: getLatestCost(), fmt: 'cfa', label: 'Dernier prix de revient' })}
      ${st({ tone: lastRec == null ? 'blue' : (daysAgo(lastRec.date) >= 7 ? 'red' : 'green'),
             icon: 'clock',
             value: lastRec ? agoLabel(lastRec.date) : '—',
             label: lastRec
               ? `Dernière réception : ${lastRec.quantity} plateaux le ${fmtD(lastRec.date)}`
               : 'Aucune réception enregistrée' })}
    </div>

    <div class="card">
      <h3>Réceptions</h3>
      ${moRec.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Quantité</th><th>Prix unitaire</th><th>Total</th><th></th></tr></thead>
        <tbody>${moRec.map(function (r) {
          return `<tr>
            <td class="nowrap">${fmtD(r.date)}</td>
            <td>${r.quantity}</td>
            <td>${cfa(r.costPrice)}</td>
            <td>${cfa(r.quantity * r.costPrice)}</td>
            <td><button class="btn-icon" onclick="delReception('${r.id}')" title="Supprimer">&times;</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : emptyState({ icon: 'truck', small: true, text: 'Aucune réception ce mois' })}
    </div>

    <div class="card">
      <h3>Journal quotidien</h3>
      ${moDates.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Reçu</th><th>Vendu</th><th>Stock le soir</th><th>Inventaire</th></tr></thead>
        <tbody>${moDates.map(function (d) {
          const iv = inventoryOn(d);
          const gp = stockGap(d);
          return `<tr>
            <td class="nowrap">${fmtD(d)}</td>
            <td>${getReceived(d) || '—'}</td>
            <td>${getSold(d) || '—'}</td>
            <td><strong>${num(stockOn(d))}</strong></td>
            <td>${iv
              ? `${num(iv.closingStock)} <span class="cell-sub" style="color:${gp === 0 ? 'var(--green)' : 'var(--red)'}">${gapLabel(gp)}</span>`
              : '<span class="muted">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : emptyState({ icon: 'calendar', small: true, text: 'Aucun mouvement ce mois' })}
      ${S.initialStock != null ? `<div class="form-hint" style="margin-top:10px">
        Stock de départ : <strong>${S.initialStock} plateaux</strong>${S.initialStockDate
          ? ` au ${fmtD(S.initialStockDate)}`
          : ' — <span style="color:var(--red)">date non renseignée</span>'}
        <button class="btn-icon edit" onclick="setInitStock()" title="Corriger le stock de départ">&#9998;</button>
      </div>` : ''}
    </div>`;
}

/* --- Stock de depart --- */

function setInitStock() {
  const has = S.initialStock != null;
  openModal(has ? 'Corriger le stock de départ' : 'Stock de départ', `
    <div class="form-row">
      <div class="form-g"><label>Plateaux en magasin *</label><input id="m-qty" type="number" min="0" value="${has ? S.initialStock : ''}"></div>
      <div class="form-g"><label>À la date du *</label><input id="m-date" type="date" max="${today()}" value="${S.initialStockDate || today()}"></div>
    </div>
    <div class="form-hint">Point de départ du suivi. À partir de cette date, les réceptions font monter le stock et les ventes le font baisser, sans autre saisie.</div>
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveInitStock()">Enregistrer</button>
    </div>`);
}

function saveInitStock() {
  const q = parseInt(document.getElementById('m-qty').value, 10);
  const d = val('m-date') || today();
  if (isNaN(q) || q < 0) { toast('Quantité invalide', 'err'); return; }
  if (d > today()) { toast('La date ne peut pas être dans le futur', 'err'); return; }
  S.initialStock = q;
  S.initialStockDate = d;
  save(); closeModal(); rStock(); toast('Stock de départ enregistré');
}

/* --- Receptions --- */

function addReception() {
  const lr = lastReception();
  openModal('Nouvelle réception', `
    ${lr ? `<div class="form-hint" style="margin-bottom:12px">Dernière réception : <strong>${lr.quantity} plateaux</strong> le ${fmtD(lr.date)} (${agoLabel(lr.date)}).</div>` : ''}
    <div class="form-g"><label>Date de réception *</label><input id="m-date" type="date" value="${today()}"></div>
    <div class="form-row">
      <div class="form-g"><label>Quantité (plateaux) *</label><input id="m-qty" type="number" min="1"></div>
      <div class="form-g"><label>Prix de revient/plateau (FCFA) *</label><input id="m-cost" type="number" min="0" value="${getLatestCost() || ''}"></div>
    </div>
    <div class="form-g"><label>Fournisseur</label><input id="m-sup"></div>
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveReception()">Enregistrer</button>
    </div>`);
}

function saveReception() {
  const q = parseInt(document.getElementById('m-qty').value, 10);
  const c = numVal('m-cost');
  const d = val('m-date') || today();
  if (!q || q <= 0 || isNaN(c)) { toast('Quantité et prix requis', 'err'); return; }
  S.receptions.push({
    id: gid(),
    date: d,
    quantity: q,
    costPrice: c,
    supplier: val('m-sup')
  });
  save(); closeModal(); rStock();
  toast('Réception enregistrée');
  warnStockAfter(d);
}

async function delReception(id) {
  if (await showConfirm('Supprimer cette réception ?')) {
    S.receptions = S.receptions.filter(function (x) { return x.id !== id; });
    save(); rStock(); toast('Réception supprimée');
  }
}

/* --- Inventaire du soir --- */

/* Le comptage physique remet le compteur a la realite du magasin. On
   affiche d'abord le theorique pour que l'ecart saute aux yeux : c'est
   lui qui revele la casse, les oublis de saisie ou les erreurs. */
function doInventory() {
  const t   = today();
  const inv = inventoryOn(t);
  const b   = stockBasis(t);
  openModal(inv ? "Corriger l'inventaire" : 'Inventaire du soir', `
    <div class="form-hint" style="margin-bottom:14px;line-height:1.7">
      ${esc(b.label)} : <strong>${num(b.base)}</strong><br>
      + ${num(b.received)} reçus &nbsp;·&nbsp; − ${num(b.sold)} vendus<br>
      = stock théorique ce soir : <strong>${num(b.theo)} plateaux</strong>
    </div>
    <div class="form-g">
      <label>Plateaux réellement comptés *</label>
      <input id="m-closing" type="number" min="0" value="${inv ? inv.closingStock : ''}"
             oninput="updInvGap(${b.theo})" autofocus>
      <div class="form-hint" id="m-gap">${inv ? invGapLabel(inv.closingStock - b.theo) : ''}</div>
    </div>
    <div class="modal-ft">
      ${inv ? `<button class="btn btn-s" onclick="delInventory()">Supprimer</button>` : ''}
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveInventory()">Enregistrer</button>
    </div>`);
}

/* Ecart en une expression courte, pour les tableaux */
function gapLabel(gap) {
  if (gap === 0) return 'conforme';
  return 'écart ' + (gap > 0 ? '+' : '−') + Math.abs(gap);
}

/* Libelle long de l'ecart, code par couleur : un manquant n'est pas une
   information neutre, il doit se voir. */
function invGapLabel(gap) {
  if (gap === 0) return '<span style="color:var(--green)">Comptage conforme au théorique.</span>';
  if (gap < 0) return '<span style="color:var(--red)">Manquant de ' + (-gap) + ' plateaux — casse, don, ou vente non saisie.</span>';
  return '<span style="color:var(--gold-h)">Excédent de ' + gap + ' plateaux — réception non saisie, ou vente comptée en trop.</span>';
}

function updInvGap(theo) {
  const el = document.getElementById('m-gap');
  const raw = document.getElementById('m-closing').value;
  const n = parseInt(raw, 10);
  el.innerHTML = (raw === '' || isNaN(n)) ? '' : invGapLabel(n - theo);
}

function saveInventory() {
  const cl = parseInt(document.getElementById('m-closing').value, 10);
  const t = today();
  if (isNaN(cl) || cl < 0) { toast('Valeur invalide', 'err'); return; }

  const gap = cl - theoreticalStock(t);
  const entry = S.daily.find(function (e) { return e.date === t; });
  if (entry) entry.closingStock = cl;
  else S.daily.push({ date: t, closingStock: cl });

  save(); closeModal(); rStock();
  toast(gap === 0 ? 'Inventaire conforme' : 'Inventaire enregistré — écart de ' + gap + ' plateaux',
        gap === 0 ? 'ok' : 'info');
}

async function delInventory() {
  if (!await showConfirm("Supprimer l'inventaire du jour ? Le stock repartira du calcul théorique.")) return;
  S.daily = S.daily.filter(function (e) { return e.date !== today(); });
  save(); closeModal(); rStock(); toast('Inventaire supprimé');
}

/* Appelee apres tout mouvement (vente ou reception). Elle couvre les deux
   cas ou le stock affiche ne correspondra pas a ce que l'utilisateur
   attend, plutot que de le laisser le decouvrir plus tard :

   1. un inventaire cloture sa journee — un mouvement saisi apres coup sur
      ce jour-la ne rebaisse plus le stock, c'est le comptage qui fait foi ;
   2. un stock negatif signale une saisie manquante ou dupliquee. */
function warnStockAfter(date) {
  if (inventoryOn(date)) {
    toast("Un inventaire existe déjà pour ce jour : corrigez-le pour en tenir compte", 'info');
    return;
  }
  if (getCurrentStock() < 0) {
    toast('Stock négatif : vérifiez vos réceptions ou faites un inventaire', 'err');
  }
}

/* ===== js/pages/margins.js ===== */
/* =====================================================================
   PAGE — MARGES
   Une vente = une quantite, un prix de vente et un prix de revient.
   La marge est toujours recalculee, jamais stockee : corriger une vente
   corrige aussitot tous les totaux.
   Marge nette = marge brute - depenses. Elle se recalcule a chaque rendu,
   donc suit en direct toute vente ou depense ajoutee, modifiee ou supprimee.
   ===================================================================== */
function rMargins() {
  const mo = selMonth;
  const list = S.sales
    .filter(function (s) { return s.date.startsWith(mo); })
    .sort(function (a, b) { return b.date.localeCompare(a.date); });
  const moExp = S.expenses.filter(function (e) { return e.date.startsWith(mo); });

  const totalRev  = list.reduce(function (s, x) { return s + x.quantity * x.sellingPrice; }, 0);
  const totalCost = list.reduce(function (s, x) { return s + x.quantity * x.costPrice; }, 0);
  const totalQty  = list.reduce(function (s, x) { return s + x.quantity; }, 0);
  const totalExp  = moExp.reduce(function (s, x) { return s + x.amount; }, 0);
  const totalMargin = totalRev - totalCost;
  const totalNet    = totalMargin - totalExp;
  const rate    = totalRev ? (totalMargin / totalRev) * 100 : 0;
  const netRate = totalRev ? (totalNet / totalRev) * 100 : 0;

  /* Regroupement par jour, pour le resume. Un jour avec des depenses mais
     sans vente apparait aussi : sans lui, la colonne marge nette ne
     retomberait pas sur le total du mois. */
  const byDate = {};
  function day(d) {
    if (!byDate[d]) byDate[d] = { rev: 0, cost: 0, qty: 0, exp: 0 };
    return byDate[d];
  }
  list.forEach(function (s) {
    const v = day(s.date);
    v.rev  += s.quantity * s.sellingPrice;
    v.cost += s.quantity * s.costPrice;
    v.qty  += s.quantity;
  });
  moExp.forEach(function (e) { day(e.date).exp += e.amount; });

  document.getElementById('pg-margins').innerHTML = `
    <div class="pg-hd">
      <h1>Marges</h1>
      <button class="btn btn-p" onclick="addSale()">${icon('plus')} Vente du jour</button>
    </div>

    ${moNav()}

    <div class="stats">
      ${st({ tone: 'blue',  icon: 'coins',   value: cfa(totalRev), count: totalRev, fmt: 'cfa', label: "Chiffre d'affaires" })}
      ${st({ tone: 'green', icon: 'percent', value: cfa(totalMargin), count: totalMargin, fmt: 'cfa',
             label: `Marge brute${totalRev ? ` · ${rate.toFixed(0)} %` : ''}` })}
      ${st({ tone: 'gold',  icon: 'box',     value: num(totalQty), count: totalQty, label: 'Plateaux vendus' })}
      ${st({ tone: 'red',   icon: 'receipt', value: cfa(totalCost), count: totalCost, fmt: 'cfa', label: 'Coût total' })}
      ${st({ tone: totalNet >= 0 ? 'green' : 'red', icon: 'trend', value: cfa(totalNet), count: totalNet, fmt: 'cfa',
             label: `Marge nette${totalRev ? ` · ${netRate.toFixed(0)} %` : ''}` })}
    </div>

    ${Object.keys(byDate).length ? `<div class="card">
      <h3>Résumé par jour</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Plateaux</th><th>Chiffre d'aff.</th><th>Coût</th><th>Marge brute</th><th>Dépenses</th><th class="ta-r">Marge nette</th></tr></thead>
        <tbody>${Object.entries(byDate)
          .sort(function (a, b) { return b[0].localeCompare(a[0]); })
          .map(function (entry) {
            const d = entry[0], v = entry[1], m = v.rev - v.cost, n = m - v.exp;
            return `<tr>
              <td class="nowrap">${fmtD(d)}</td>
              <td>${v.qty}</td>
              <td>${cfa(v.rev)}</td>
              <td>${cfa(v.cost)}</td>
              <td style="font-weight:600;color:${m >= 0 ? 'var(--green)' : 'var(--red)'}">${cfa(m)}</td>
              <td>${v.exp ? cfa(v.exp) : '—'}</td>
              <td class="ta-r" style="font-weight:600;color:${n >= 0 ? 'var(--green)' : 'var(--red)'}">${cfa(n)}</td>
            </tr>`;
          }).join('')}</tbody>
      </table></div>
    </div>` : ''}

    ${list.length ? `<div class="card">
      <h3>Détail des ventes</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Qté</th><th>Prix vente</th><th>Prix revient</th><th>Marge</th><th></th></tr></thead>
        <tbody>${list.map(function (s) {
          const m = (s.sellingPrice - s.costPrice) * s.quantity;
          return `<tr>
            <td class="nowrap">${fmtD(s.date)}</td>
            <td>${s.quantity}</td>
            <td>${cfa(s.sellingPrice)}</td>
            <td>${cfa(s.costPrice)}</td>
            <td style="font-weight:600;color:${m >= 0 ? 'var(--green)' : 'var(--red)'}">${cfa(m)}</td>
            <td class="nowrap">
              <button class="btn-icon edit" onclick="editSale('${s.id}')" title="Modifier">&#9998;</button>
              <button class="btn-icon" onclick="delSale('${s.id}')" title="Supprimer">&times;</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>` : emptyState({
      icon: 'trend',
      title: 'Aucune vente ce mois',
      text: `Enregistrez vos ventes pour suivre le chiffre d'affaires et la marge de ${moLabel(mo)}.`,
      action: `<button class="btn btn-p" onclick="addSale()">${icon('plus')} Vente du jour</button>`
    })}`;
}

function saleForm(s) {
  const cost = s ? s.costPrice : getLatestCost();
  /* Le stock baisse tout seul a l'enregistrement : on montre ce qui reste
     en magasin pour que la quantite se saisisse en connaissance de cause.
     Sur une modification, la vente en cours est deja deduite du stock —
     on la remet pour afficher ce qui etait disponible avant elle. */
  const avail = getCurrentStock() + (s ? s.quantity : 0);
  return `
    <div class="form-g"><label>Date</label><input id="m-date" type="date" value="${s ? s.date : today()}"></div>
    <div class="form-row">
      <div class="form-g"><label>Plateaux vendus *</label><input id="m-qty" type="number" min="1" value="${s ? s.quantity : ''}"></div>
      <div class="form-g"><label>Prix de vente/plateau (FCFA) *</label><input id="m-sell" type="number" min="0" value="${s ? s.sellingPrice : ''}"></div>
    </div>
    <div class="form-hint" style="margin:-8px 0 16px">
      Stock en magasin : <strong>${num(avail)} plateau${avail > 1 ? 'x' : ''}</strong> — il baissera d'autant à l'enregistrement.
    </div>
    <div class="form-g"><label>Prix de revient/plateau (FCFA)</label>
      <input id="m-cost" type="number" min="0" value="${cost || ''}">
      ${s ? '' : '<div class="form-hint">Pré-rempli depuis la dernière réception</div>'}
    </div>`;
}

function addSale() {
  openModal('Enregistrer une vente', saleForm(null) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveSale()">Enregistrer</button>
    </div>`);
}

function saveSale() {
  const q  = parseInt(document.getElementById('m-qty').value, 10);
  const sp = numVal('m-sell');
  const cp = numVal('m-cost');
  const d  = val('m-date') || today();
  if (!q || q <= 0 || isNaN(sp)) { toast('Quantité et prix de vente requis', 'err'); return; }
  S.sales.push({
    id: gid(),
    date: d,
    quantity: q,
    sellingPrice: sp,
    costPrice: cp || 0
  });
  /* Le stock est deduit des ventes : il n'y a rien de plus a ecrire, mais
     la page Stock doit repartir a jour si l'utilisateur y revient. */
  save(); closeModal(); refresh();
  toast('Vente enregistrée — stock à jour');
  warnStockAfter(d);
}

function editSale(id) {
  const s = S.sales.find(function (x) { return x.id === id; });
  if (!s) return;
  openModal('Modifier la vente', saleForm(s) + `
    <div class="modal-ft">
      <button class="btn btn-s" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="updSale('${id}')">Enregistrer</button>
    </div>`);
}

function updSale(id) {
  const s = S.sales.find(function (x) { return x.id === id; });
  if (!s) return;
  const q  = parseInt(document.getElementById('m-qty').value, 10);
  const sp = numVal('m-sell');
  const cp = numVal('m-cost');
  if (!q || isNaN(sp)) { toast('Champs requis', 'err'); return; }
  s.date = val('m-date') || s.date;
  s.quantity = q;
  s.sellingPrice = sp;
  s.costPrice = cp || 0;
  save(); closeModal(); refresh();
  toast('Vente modifiée — stock à jour');
  warnStockAfter(s.date);
}

async function delSale(id) {
  if (await showConfirm('Supprimer cette vente ?')) {
    S.sales = S.sales.filter(function (x) { return x.id !== id; });
    save(); refresh(); toast('Vente supprimée — stock à jour');
  }
}

/* ===== js/pages/settings.js ===== */
/* =====================================================================
   PAGE — PARAMETRES
   Quatre blocs, dans l'ordre ou l'on s'en sert : sortir les donnees,
   les rentrer, verifier la sauvegarde cloud, proteger le compte. Les deux
   blocs qui tiennent en une phrase — import et cloud — se partagent une
   ligne ; les deux autres, plus fournis, la prennent entiere.

   Le bloc « donnees locales » a ete retire : compter les enregistrements
   n'apprenait rien, et le bouton « effacer toutes les donnees » n'avait
   rien a faire dans un ecran ouvert tous les jours. Une remise a zero se
   fait desormais par un import, qui remplace les donnees en gardant une
   trace de ce qu'on met a la place.
   ===================================================================== */
function rSettings() {
  const heure = lastSync
    ? lastSync.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : null;

  document.getElementById('pg-settings').innerHTML = `
    <div class="pg-hd"><h1>Paramètres</h1></div>

    <div class="card card-wide">
      <h3>${icon('download')} Exporter les données</h3>

      <div class="set-group">
        <span class="eyebrow">Rapports PDF</span>
        <p class="set-hint">Documents mis en page, prêts à enregistrer en PDF ou à imprimer.
          Choisissez « Enregistrer au format PDF » comme destination dans la fenêtre d'impression.</p>
        <div class="set-mo">
          <div class="form-g"><label for="repMo">Mois du rapport</label>
            <select id="repMo">${moOptions(selMonth)}</select>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-p" onclick="repMonth(val('repMo'))">${icon('receipt')} Rapport mensuel</button>
          <button class="btn btn-s" onclick="repStock(val('repMo'))">${icon('box')} Journal du stock</button>
          <button class="btn btn-s" onclick="repClients()">${icon('users')} Fichier clients</button>
          <button class="btn btn-s" onclick="repDebts()">${icon('wallet')} État des créances</button>
        </div>
      </div>

      <div class="set-group">
        <span class="eyebrow">Sauvegarde réimportable</span>
        <p class="set-hint">Le fichier JSON contient tout et reste le seul format que
          l'application sait relire. Gardez-en une copie hors de ce téléphone.</p>
        <div class="btn-group">
          <button class="btn btn-s" onclick="expJSON()">${icon('db')} Sauvegarde JSON complète</button>
        </div>
      </div>

      <div class="set-group">
        <span class="eyebrow">Tableurs CSV</span>
        <p class="set-hint">Pour retravailler les chiffres dans Excel ou Google Sheets.</p>
        <div class="btn-group">
          <button class="btn btn-s btn-sm" onclick="expCSV('clients')">Clients</button>
          <button class="btn btn-s btn-sm" onclick="expCSV('debts')">Dettes</button>
          <button class="btn btn-s btn-sm" onclick="expCSV('expenses')">Dépenses</button>
          <button class="btn btn-s btn-sm" onclick="expCSV('sales')">Ventes</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>${icon('upload')} Importer des données</h3>
      <p class="card-sub">Restaurez vos données depuis un fichier JSON exporté précédemment.
        L'import <strong>remplace</strong> les données actuelles, ici et dans le cloud.</p>
      <input type="file" id="importFile" accept=".json" hidden onchange="doImport(this)">
      <button class="btn btn-s" onclick="document.getElementById('importFile').click()">Choisir un fichier JSON</button>
    </div>

    <div class="card">
      <h3>${icon('cloud')} Sauvegarde cloud</h3>
      <p class="card-sub">
        Vos données partent dans le cloud à chaque modification.
        Statut : <span class="dot ${cloudOK ? 'on' : 'off'}"></span><strong>${cloudOK ? 'Connecté' : 'Non connecté'}</strong>${heure ? ` · dernière sauvegarde à ${heure}` : ''}
      </p>
      <div class="btn-group">
        <button class="btn btn-p" onclick="syncNow()">Forcer la synchro</button>
        <button class="btn btn-s" onclick="cloudRestore()">Restaurer depuis le cloud</button>
      </div>
    </div>

    <div class="card card-wide">
      <h3>${icon('shield')} Sécurité</h3>
      <p class="card-sub">Connecté en tant que <strong>${esc(curEmail)}</strong>.

      <div class="form-row">
        <div class="form-g"><label>Nouveau mot de passe</label><input id="pw1" type="password" autocomplete="new-password"></div>
        <div class="form-g"><label>Confirmer</label><input id="pw2" type="password" autocomplete="new-password"></div>
      </div>
      <button class="btn btn-p" onclick="changePassword()">Changer le mot de passe</button>
    </div>
`;
}

/* Les douze derniers mois, du plus recent au plus ancien. Suffisant pour
   rééditer un rapport passé sans transformer le champ en calendrier. */
function moOptions(sel) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = 0; i < 12; i++) {
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    out.push('<option value="' + ym + '"' + (ym === sel ? ' selected' : '') + '>'
             + moLabel(ym) + '</option>');
    d.setMonth(d.getMonth() - 1);
  }
  return out.join('');
}

/* ===== js/init.js ===== */
/* =====================================================================
   DEMARRAGE — point d'entree, execute une fois le DOM en place
   Ce fichier est le dernier assemble par build.js : toutes les fonctions
   des autres modules sont deja definies quand il s'execute.
   ===================================================================== */

/* --- Raccourcis clavier --- */
function initKeys() {
  /* Entree valide le formulaire de connexion */
  document.getElementById('logPass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('logEmail').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('logPass').focus();
  });

  /* Echap ferme la modale ouverte, ou le menu mobile */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('modalOv').hidden) closeModal();
    else closeSide();
  });
}

/* --- Sequence de demarrage --- */
applyTheme();
setSync('off', 'Hors ligne');

S = load();
selMonth = curMo();

initDL();
initKeys();
initRipple();

/* Supabase conserve la session entre les visites : si elle est encore
   valide, on rouvre l'application directement, sinon on reste sur
   l'ecran de connexion. */
(async function initAuth() {
  if (!initSb()) return;
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      curEmail = data.session.user.email;
      cloudLoading = true;
      showApp();
      await initCloud();
      cloudLoading = false;
      render();
    }
  } catch (e) {
    console.warn('Session illisible', e);
    cloudLoading = false;
  }
})();
</script>
