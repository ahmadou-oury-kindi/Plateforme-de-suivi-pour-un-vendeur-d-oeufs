<!-- =====================================================================
     ECRAN DE CONNEXION
     Reste visible tant que Supabase n'a pas ouvert de session valide.
     ===================================================================== -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <svg class="login-logo" viewBox="0 0 56 56" fill="none" aria-hidden="true"><defs><linearGradient id="njTileL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8A139"/><stop offset="1" stop-color="#A5700E"/></linearGradient></defs><rect width="56" height="56" rx="17" fill="url(#njTileL)"/><rect x=".75" y=".75" width="54.5" height="54.5" rx="16.25" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="1.5"/><path d="M29.2 14.8c6.4 0 11 7 11 14.6 0 6.8-4.9 12-11 12s-11-5.2-11-12c0-7.6 4.6-14.6 11-14.6z" fill="#7A5208" fill-opacity=".28"/><path d="M28 13.6c6.4 0 11 7 11 14.6 0 6.8-4.9 12-11 12s-11-5.2-11-12c0-7.6 4.6-14.6 11-14.6z" fill="#FFFCF3"/></svg>
    <h1>Nenu Jolof</h1>
    <p>Plateforme de suivi &mdash; Oeufs</p>
    <div class="form-g"><label for="logEmail">Email</label><input type="email" id="logEmail" autocomplete="email"></div>
    <div class="form-g"><label for="logPass">Mot de passe</label><input type="password" id="logPass" autocomplete="current-password"></div>
    <div class="login-err" id="logErr" role="alert"></div>
    <button class="btn-login" id="logBtn" onclick="doLogin()">Connexion</button>
  </div>
</div>
