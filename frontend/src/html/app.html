<!-- =====================================================================
     APPLICATION — sidebar + conteneurs de pages
     Chaque <div class="page"> est rempli par le renderer correspondant
     (frontend/src/js/pages/*.js). Le HTML ne contient aucune donnee.

     La navigation est groupee par domaine — commercial, exploitation,
     reglages — sans changer l'ordre auquel l'utilisateur est habitue.
     ===================================================================== -->
<div id="app" class="app" hidden>
  <button class="hamburger" id="hamBtn" onclick="toggleSide()" aria-label="Ouvrir le menu">&#9776;</button>
  <div class="side-overlay" id="sideOv" onclick="toggleSide()"></div>

  <nav class="side" id="sidebar">

      <span class="bt">
        <span class="bn">Nenu Jolof</span>
        <span class="bs">Suivi des ventes</span>
      </span>
    </div>

    <ul class="nav-list">
      <li class="nav-item active" data-p="dashboard" onclick="nav('dashboard')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6.5" height="6.5" rx="1.5"/><rect x="11.5" y="2" width="6.5" height="6.5" rx="1.5"/><rect x="2" y="11.5" width="6.5" height="6.5" rx="1.5"/><rect x="11.5" y="11.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Tableau de bord</span></li>

      <li class="nav-sec">Commercial</li>
      <li class="nav-item" data-p="clients" onclick="nav('clients')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M2.5 17v-1a4 4 0 014-4h3a4 4 0 014 4v1"/><path d="M14.5 4.4a3 3 0 010 5.2M15.5 12.3a4 4 0 012 3.4V17"/></svg><span>Clients</span></li>

      <li class="nav-sec">Exploitation</li>
      <li class="nav-item" data-p="expenses" onclick="nav('expenses')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5h11v15l-2.2-1.4-2.15 1.4L9 16.1l-2.2 1.4-2.3-1.4z"/><path d="M7.2 6.6h5.6M7.2 9.8h3.8"/></svg><span>D&eacute;penses</span></li>

      <li class="nav-item" data-p="margins" onclick="nav('margins')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 14.5l4.6-5 3.2 2.8L17.5 5"/><path d="M13.2 5h4.3v4.3"/></svg><span>Marges</span></li>

      <li class="nav-sec">R&eacute;glages</li>

    <div class="side-foot">
      <div class="side-tools">
        <div class="sync" id="syncBadge" title="Statut de la sauvegarde cloud"></div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Changer de th&egrave;me" aria-label="Changer de th&egrave;me"></button>
      </div>
      <button class="nav-out" onclick="doLogout()"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17H4a1.5 1.5 0 01-1.5-1.5v-11A1.5 1.5 0 014 3h3"/><path d="M13 14l4-4-4-4"/><path d="M17 10H7"/></svg><span>D&eacute;connexion</span></button>
    </div>
  </nav>

  <main class="main" id="main">
    <div id="pg-dashboard" class="page"></div>
    <div id="pg-clients" class="page" hidden></div>
    <div id="pg-debts" class="page" hidden></div>
    <div id="pg-expenses" class="page" hidden></div>
    <div id="pg-stock" class="page" hidden></div>
    <div id="pg-margins" class="page" hidden></div>
    <div id="pg-settings" class="page" hidden></div>

</div>
